<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ELO TERRORISTS</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <span class="pulse"></span>
        <h1>ELO TERRORISTS</h1>
        <span id="db-badge" class="db-badge" title="Community database">COMMUNITY DB</span>
      </header>

      <!-- Search a player in the community DB -->
      <section class="search-section">
        <div class="search-row">
          <input
            type="text"
            id="search-input"
            placeholder="Look up any FACEIT nickname…"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="search-btn">GO</button>
        </div>
        <div id="search-result" class="search-result hidden"></div>
      </section>

      <div class="divider"></div>

      <!-- Flag a player -->
      <section>
        <form id="add-form">
          <input
            type="text"
            id="player-name"
            placeholder="FACEIT nickname to flag"
            autocomplete="off"
            spellcheck="false"
            required
          />
          <input
            type="text"
            id="comment"
            placeholder="Reason (e.g. selling games, AFK, throwing)"
            required
          />
          <button type="submit">FLAG TERRORIST</button>
        </form>
      </section>

      <div class="divider"></div>

      <!-- My flags -->
      <section>
        <div class="section-header">
          <span class="section-title">MY FLAGS</span>
          <span id="my-count" class="my-count">0</span>
        </div>
        <ul id="my-list"></ul>
      </section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
