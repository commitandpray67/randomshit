/* ============================================================================
   JAYC: THE RISE OF THE GOONERS
   A single-file pixel-art twin-stick shooter. No dependencies, no assets.

   CONTENTS
     1. Constants & utils
     2. Sprite system (character-grid -> baked offscreen canvas)
     3. Bitmap font (6x8, cached per-colour atlases)
     4. Sprite data  (JayC, enemies, bosses, props)
     5. Input        (keyboard / mouse in virtual coords / touch)
     6. Snd        (WebAudio chiptune synth + step sequencer)
     7. FX           (particles, damage numbers, shake, hitstop)
     8. Weapons & enemy stat tables
     9. Levels & story script
    10. World        (entities, spawning, collision)
    11. Update       (player, bullets, enemies, bosses, pickups)
    12. Render       (camera, background, sprites, HUD, screens)
    13. State machine & main loop
   ========================================================================= */

/* -- 1. CONSTANTS & UTILS ------------------------------------------------- */

const VW = 480, VH = 270;          // virtual resolution, everything sims here
const TAU = Math.PI * 2;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angleTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);

// move `v` toward `t` by at most `step`
function approach(v, t, step) { return v < t ? Math.min(v + step, t) : Math.max(v - step, t); }

// shortest signed angular difference a -> b
function angleDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

function save(key, val) { try { localStorage.setItem('jayc_' + key, JSON.stringify(val)); } catch (e) {} }
function load(key, def) {
  try { const v = localStorage.getItem('jayc_' + key); return v === null ? def : JSON.parse(v); }
  catch (e) { return def; }
}

/* -- 2. SPRITE SYSTEM ------------------------------------------------------
   A sprite is authored as an array of equal-length strings; each character
   indexes a palette. '.' is transparent. Grids are baked to offscreen
   canvases once at boot so the hot loop only ever calls drawImage.        */

function hexToRGB(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return c;
}

// rows: array of strings. pal: { char: '#rrggbb' }. Returns a canvas.
function bake(rows, pal, override) {
  const w = rows[0].length, h = rows.length;
  const c = makeCanvas(w, h);
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  const d = img.data;
  const cache = {};
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < w; x++) {
      const ch = row[x];
      if (ch === '.' || ch === ' ') continue;
      let rgb = cache[ch];
      if (rgb === undefined) {
        const hex = override || pal[ch];
        rgb = cache[ch] = hex ? hexToRGB(hex) : null;
      }
      if (!rgb) continue;
      const i = (y * w + x) * 4;
      d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

// Bakes a grid plus a solid-white "hit flash" twin, and a horizontally
// mirrored pair. Returns { n, f, nL, fL } (normal/flash, right/left facing).
function bakeSet(rows, pal, flashColor) {
  const n = bake(rows, pal);
  const f = bake(rows, pal, flashColor || '#ffffff');
  return { n, f, nL: mirror(n), fL: mirror(f) };
}

function mirror(src) {
  const c = makeCanvas(src.width, src.height);
  const g = c.getContext('2d');
  g.translate(src.width, 0);
  g.scale(-1, 1);
  g.drawImage(src, 0, 0);
  return c;
}

function scaleCanvas(src, f) {
  const c = makeCanvas(src.width * f, src.height * f);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(src, 0, 0, src.width * f, src.height * f);
  return c;
}
function scaleSet(set, f) {
  return { n: scaleCanvas(set.n, f), f: scaleCanvas(set.f, f), nL: scaleCanvas(set.nL, f), fL: scaleCanvas(set.fL, f) };
}

   per character rather than 35 fillRects.                                  */

const GLYPH_ORDER = Object.keys(GLYPHS);
const GLYPH_INDEX = {};
GLYPH_ORDER.forEach((ch, i) => { GLYPH_INDEX[ch] = i; });

const _atlases = new Map();
function fontAtlas(color) {
  let a = _atlases.get(color);
  if (a) return a;
  const n = GLYPH_ORDER.length;
  const c = makeCanvas(n * CELL_W, CELL_H);
  const g = c.getContext('2d');
  g.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const rows = GLYPHS[GLYPH_ORDER[i]].split('/');
    for (let y = 0; y < FONT_H; y++) {
      const row = rows[y];
      for (let x = 0; x < FONT_W; x++) {
        if (row[x] === '1') g.fillRect(i * CELL_W + x, y, 1, 1);
      }
    }
  }
  _atlases.set(color, c);
  return c;
}

function textWidth(str, spacing) { return str.length * (CELL_W + (spacing || 0)) - (spacing || 0) - 1; }

// align: 'left' | 'center' | 'right'
function drawText(g, str, x, y, color, align, spacing) {
  str = String(str).toUpperCase();
  const sp = spacing || 0;
  const w = textWidth(str, sp);
  let px = Math.floor(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  const py = Math.floor(y);
  const atlas = fontAtlas(color);
  for (let i = 0; i < str.length; i++) {
    const gi = GLYPH_INDEX[str[i]];
    if (gi !== undefined && str[i] !== ' ') {
      g.drawImage(atlas, gi * CELL_W, 0, CELL_W, CELL_H, px, py, CELL_W, CELL_H);
    }
    px += CELL_W + sp;
  }
  return w;
}

// Greedy word-wrap to a pixel width. Returns an array of lines.
function wrapText(str, maxPx, spacing) {
  const words = String(str).split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (textWidth(test, spacing || 0) > maxPx && line) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* -- 4. SPRITE DATA --------------------------------------------------------
   G(w, rows) pads every row out to width w with transparent pixels, so only
   the LEADING dots have to be counted by hand. Over-long rows throw loudly at
   boot rather than silently corrupting a sprite.                            */

function G(w, rows) {
  return rows.map((r, i) => {
    if (r.length > w) throw new Error('sprite row ' + i + ' is ' + r.length + ' wide, max ' + w + ': "' + r + '"');
    return r + '.'.repeat(w - r.length);
  });
}

/* -- 5. DISPLAY & INPUT ----------------------------------------------------
   The game renders into a 480x270 framebuffer which is then blitted to the
   visible canvas at the largest WHOLE-NUMBER scale that fits. Fractional
   scaling is what makes pixel art look smeared, so it never happens here.  */

const screenCanvas = document.getElementById('screen');
const sctx = screenCanvas.getContext('2d', { alpha: false });
const stage = makeCanvas(VW, VH);
const ctx = stage.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const View = { scale: 1, left: 0, top: 0 };

function resize() {
  const s = Math.max(1, Math.floor(Math.min(window.innerWidth / VW, window.innerHeight / VH)));
  View.scale = s;
  screenCanvas.width = VW * s;
  screenCanvas.height = VH * s;
  screenCanvas.style.width = (VW * s) + 'px';
  screenCanvas.style.height = (VH * s) + 'px';
  sctx.imageSmoothingEnabled = false;
  const r = screenCanvas.getBoundingClientRect();
  View.left = r.left; View.top = r.top;
}
window.addEventListener('resize', resize);

const Input = {
  keys: new Set(),
  pressed: new Set(),      // cleared every frame; for edge-triggered actions
  mx: VW / 2, my: VH / 2,
  down: false, downEdge: false,
  touch: { active: false, stickId: -1, sx: 0, sy: 0, dx: 0, dy: 0, aimId: -1 },

  has(...codes) { return codes.some(c => this.keys.has(c)); },
  hit(...codes) { return codes.some(c => this.pressed.has(c)); },

  moveVector() {
    let x = 0, y = 0;
    if (this.has('KeyA', 'ArrowLeft')) x -= 1;
    if (this.has('KeyD', 'ArrowRight')) x += 1;
    if (this.has('KeyW', 'ArrowUp')) y -= 1;
    if (this.has('KeyS', 'ArrowDown')) y += 1;
    if (this.touch.stickId >= 0) { x += this.touch.dx; y += this.touch.dy; }
    const m = Math.hypot(x, y);
    return m > 1 ? { x: x / m, y: y / m } : { x, y };
  },

  endFrame() { this.pressed.clear(); this.downEdge = false; },
};

const BLOCKED_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);

window.addEventListener('keydown', e => {
  if (BLOCKED_KEYS.has(e.code)) e.preventDefault();
  if (e.repeat) return;
  Input.keys.add(e.code);
  Input.pressed.add(e.code);
  Snd.unlock();
});
window.addEventListener('keyup', e => Input.keys.delete(e.code));
window.addEventListener('blur', () => { Input.keys.clear(); Input.down = false; });

function toVirtual(clientX, clientY) {
  return {
    x: clamp((clientX - View.left) / View.scale, 0, VW),
    y: clamp((clientY - View.top) / View.scale, 0, VH),
  };
}

screenCanvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousemove', e => {
  const p = toVirtual(e.clientX, e.clientY);
  Input.mx = p.x; Input.my = p.y;
});
window.addEventListener('mousedown', e => {
  const p = toVirtual(e.clientX, e.clientY);
  Input.mx = p.x; Input.my = p.y;
  if (e.button === 2) { Input.keys.add('Space'); Input.pressed.add('Space'); e.preventDefault(); }
  else { Input.down = true; Input.downEdge = true; }
  Snd.unlock();
});
window.addEventListener('mouseup', e => {
  if (e.button === 2) Input.keys.delete('Space');
  else Input.down = false;
});

/* Touch: left half of the screen is a virtual stick, right half aims and
   auto-fires. Keeps the game playable on a phone without a second layout. */
function handleTouch(e) {
  e.preventDefault();
  Snd.unlock();
  const t = Input.touch;
  for (const touch of e.changedTouches) {
    const p = toVirtual(touch.clientX, touch.clientY);
    if (e.type === 'touchstart') {
      if (p.x < VW / 2 && t.stickId < 0) { t.stickId = touch.identifier; t.sx = p.x; t.sy = p.y; t.dx = t.dy = 0; }
      else if (t.aimId < 0) { t.aimId = touch.identifier; Input.mx = p.x; Input.my = p.y; Input.down = true; Input.downEdge = true; }
    } else if (e.type === 'touchmove') {
      if (touch.identifier === t.stickId) {
        const dx = p.x - t.sx, dy = p.y - t.sy, m = Math.hypot(dx, dy);
        const max = 18;
        t.dx = m > max ? dx / m : dx / max;
        t.dy = m > max ? dy / m : dy / max;
      } else if (touch.identifier === t.aimId) { Input.mx = p.x; Input.my = p.y; }
    } else {
      if (touch.identifier === t.stickId) { t.stickId = -1; t.dx = t.dy = 0; }
      if (touch.identifier === t.aimId) { t.aimId = -1; Input.down = false; }
    }
  }
  t.active = true;
}
for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
  window.addEventListener(type, handleTouch, { passive: false });
}

   Everything is synthesised: square/pulse leads, noise percussion, short

/* -- 6b. AUTHORED BOSS THEMES ----------------------------------------------
   Still fully synthesised - these are note tables the sequencer reads instead
   of the procedural arpeggio. cait gets an original cozy island tune; Mustie
   gets Ceddin Deden, the traditional Ottoman mehter march (public domain). */
const NOTE_BASE = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
function noteFreq(name) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
  if (!m) return 0;
  let semis = NOTE_BASE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  semis += (parseInt(m[3], 10) - 4) * 12;
  return 440 * Math.pow(2, semis / 12);
}
// expand ['B4:1','R:2',...] (name:steps, R = rest) into a per-step note array
function expandVoice(tokens, loopLen, vol) {
  const out = new Array(loopLen).fill(null);
  let step = 0;
  for (const tok of tokens) {
    const parts = tok.split(':');
    const len = parts[1] ? parseInt(parts[1], 10) : 1;
    if (parts[0] !== 'R' && step < loopLen) out[step] = { f: noteFreq(parts[0]), len: len, v: vol };
    step += len;
  }
  return out;
}
const SONGS = {};
(function buildSongs() {
  // cait - "The Island": original, bright, relaxed F major
  (function () {
    const len = 32;
    const lead = expandVoice([
      'A4:2','C5:2','F5:2','A5:2','G5:2','F5:1','E5:1','F5:2','R:2',
      'A4:2','C5:2','G5:2','C6:2','A5:2','G5:2','F5:2','R:2'
    ], len, 0.15);
    const bass = expandVoice([
      'F2:4','R:4','C3:4','R:4','D3:4','R:4','C3:4','R:4'
    ], len, 0.3);
    const chord = new Array(len).fill(null);
    [[0, ['F3','A3','C4']], [8, ['C3','E3','G3']], [16, ['G3','Bb3','D4']], [24, ['A3','C4','E4']]]
      .forEach(function (e) { chord[e[0]] = e[1].map(noteFreq); });
    SONGS.island = {
      stepDur: 0.15, len: len, lead: lead, bass: bass, chord: chord,
      leadType: 'triangle', bassType: 'triangle', chordType: 'sine',
      perc: function (step, when, dur, snd) {

  // Mustie - "Ceddin Deden": traditional Ottoman mehter march (public domain),
  //   in D minor; the "re la la la" call is the famous "Ceddin deden neslin baban".

const Snd = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  muted: load('muted', false),
  step: 0, nextNoteTime: 0, timer: null, scale: null, boss: false, song: null,

  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.5;
      this.sfxGain.connect(this.master);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.22;
      this.musicGain.connect(this.master);
    } catch (e) { this.ctx = null; }
  },

  setMuted(m) {
    this.muted = m;
    save('muted', m);
    if (this.master) this.master.gain.value = m ? 0 : 0.9;
  },

  // one-shot tone with an optional pitch slide
  tone(freq, dur, type, vol, slideTo) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol === undefined ? 0.3 : vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur, vol, filterFreq) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = filterFreq || 1800;
    const g = this.ctx.createGain();
    g.gain.value = vol === undefined ? 0.3 : vol;
    src.connect(f); f.connect(g); g.connect(this.sfxGain);
    src.start(t);
  },

  shoot()   { this.tone(700, 0.07, 'square', 0.14, 240); },
  shotgun() { this.tone(320, 0.13, 'sawtooth', 0.16, 90); this.noise(0.12, 0.16, 1400); },
  smg()     { this.tone(900, 0.04, 'square', 0.08, 500); },
  rail()    { this.tone(1400, 0.22, 'sawtooth', 0.16, 180); },
  hit()     { this.tone(200, 0.05, 'square', 0.1, 120); },
  kill()    { this.noise(0.16, 0.2, 1100); this.tone(180, 0.14, 'triangle', 0.12, 60); },
  explode() { this.noise(0.42, 0.34, 700); this.tone(90, 0.36, 'sawtooth', 0.18, 30); },
  hurt()    { this.tone(260, 0.2, 'sawtooth', 0.22, 70); },
  dash()    { this.tone(520, 0.13, 'triangle', 0.12, 1100); },
  pickup()  { this.tone(880, 0.07, 'square', 0.16); setTimeout(() => this.tone(1320, 0.09, 'square', 0.14), 60); },
  clarity() { this.tone(180, 0.6, 'sawtooth', 0.2, 1600); this.noise(0.5, 0.25, 3000); },
  select()  { this.tone(660, 0.05, 'square', 0.12); },
  bossHit() { this.tone(120, 0.3, 'sawtooth', 0.2, 50); this.noise(0.3, 0.2, 500); },

  /* Step sequencer. Scheduled against ctx.currentTime with a short lookahead
     so timing does not drift with the frame rate. */
  /* Where the sibling audio files live when they are not embedded.

     A host may serve this page as /jayc, /jayc/, or /jayc/index.html, and the
     first of those is the trap: with no trailing slash the browser treats
     "jayc" as a filename, so a bare relative path resolves against the site
     root and every track 404s into the synth fallback. Work the directory out
     from the path instead of trusting relative resolution. */
  assetBase() {
    const p = location.pathname;
    // A path ending in a file extension names a file; strip it to its folder.
    if (/\.[a-z0-9]+$/i.test(p)) return p.replace(/[^/]*$/, '');
    // Otherwise the whole path is the folder, slash or no slash.
    return p.replace(/\/?$/, '/');
  },

  /* Each track carries both a base64 blob and a file path. The standalone
     build embeds the blob so the page works from file:// with no server;
     the web build nulls the blobs and lets `src` be fetched on demand, so
     a visitor downloads a boss theme only when they reach that boss. */
  tracks: {
    island:  { b64: AUDIO_ISLAND, src: 'audio/island.mp3',  buffer: null, loading: false },
    turkish: { b64: AUDIO_MUSTIE, src: 'audio/turkish.mp3', buffer: null, loading: false },
    werder:  { b64: AUDIO_WERDER, src: 'audio/werder.mp3',  buffer: null, loading: false },
    harold:  { b64: AUDIO_HAROLD, src: 'audio/harold.mp3',  buffer: null, loading: false }
  },
  trackSrc: null, wantTrack: null,

  startMusic(scale, boss, song) {
    this.scale = scale; this.boss = !!boss; this.step = 0;
    this.stopTrack();
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (song && this.tracks[song] && (this.tracks[song].b64 || this.tracks[song].src)) { this.song = null; this.playTrack(song); return; }
    this.song = (song && SONGS[song]) ? SONGS[song] : null;
    if (!this.ctx) return;
    this.nextNoteTime = this.ctx.currentTime;
    this.timer = setInterval(() => this.schedule(), 25);
  },
  stopMusic() { if (this.timer) { clearInterval(this.timer); this.timer = null; } this.song = null; this.stopTrack(); },

  // real boss tracks: decode an embedded mp3 and loop it on the music bus,
  // falling back to the synth theme if the file is absent or won't decode.
  playTrack(name) {
    const tr = this.tracks[name];
    if (!this.ctx || !tr || (!tr.b64 && !tr.src)) { this.fallbackSong(name); return; }
    this.wantTrack = name;
    const go = () => {
      if (this.wantTrack !== name || !tr.buffer) return;
      this.stopTrack(); this.wantTrack = name;
      const src = this.ctx.createBufferSource();
      src.buffer = tr.buffer; src.loop = true;
      src.connect(this.musicGain); src.start();
      this.trackSrc = src;
    };
    if (tr.buffer) { go(); return; }

    // Decoding is async either way, so the synth theme starts immediately and
    // is swapped out the moment the real track is ready. A boss fight is never
    // silent while a download is in flight.
    const decode = (arrayBuffer) => {
      this.ctx.decodeAudioData(arrayBuffer, (buf) => {
        tr.buffer = buf;
        if (this.wantTrack !== name) return;
        // Silence the synth sequencer before the real track takes over,
        // otherwise the fallback keeps stepping underneath it.
        if (this.timer) { clearInterval(this.timer); this.timer = null; }
        this.song = null;
        go();
      }, () => this.fallbackSong(name));
    };

    if (tr.b64) {
      try {
        const bin = atob(tr.b64), n = bin.length, bytes = new Uint8Array(n);
        for (let i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i);
        decode(bytes.buffer);
      } catch (e) { this.fallbackSong(name); }
      return;
    }

    // Web build: the mp3 sits next to index.html. Play the synth theme now and
    // upgrade when the fetch lands; a failed fetch just means we keep it.
    this.fallbackSong(name);
    if (tr.loading) return;
    tr.loading = true;
    fetch(this.assetBase() + tr.src)
      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(decode)
      .catch(() => {})
      .then(() => { tr.loading = false; });
  },
  stopTrack() { if (this.trackSrc) { try { this.trackSrc.stop(); } catch (e) {} this.trackSrc = null; } this.wantTrack = null; },
  fallbackSong(name) {
    this.song = SONGS[name] || null;
    if (!this.ctx || this.timer) return;
    this.nextNoteTime = this.ctx.currentTime;
    this.timer = setInterval(() => this.schedule(), 25);
  },

  schedule() {
    if (!this.ctx || this.muted || !this.scale) return;
    const song = this.song;
    const stepDur = song ? song.stepDur : (this.boss ? 0.115 : 0.135);
    const loopLen = song ? song.len : 32;
    while (this.nextNoteTime < this.ctx.currentTime + 0.12) {
      if (song) this.playSong(song, this.step, this.nextNoteTime, stepDur);
      else this.playStep(this.step, this.nextNoteTime, stepDur);
      this.nextNoteTime += stepDur;
      this.step = (this.step + 1) % loopLen;
    }
  },

  playStep(step, when, dur) {
    const sc = this.scale;
    const voice = (freq, type, vol, len) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, when);
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(vol, when + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, when + len);
      o.connect(g); g.connect(this.musicGain);
      o.start(when); o.stop(when + len + 0.02);
    };
    // bass on the downbeats
    if (step % 4 === 0) {
      const root = sc[0] / 2;
      voice(step % 16 === 8 ? root * 1.5 : root, 'triangle', 0.5, dur * 3);
    }
    // arpeggio
    const arp = sc[(step * 3 + (step >> 3)) % sc.length] * (step % 8 < 4 ? 1 : 2);
    voice(arp, 'square', 0.14, dur * 0.85);
    // hats / kick
    if (step % 4 === 2) this.hat(when, 0.05);
    if (this.boss && step % 8 === 6) this.hat(when, 0.09);
  },

  hat(when, vol) {
    const len = Math.floor(this.ctx.sampleRate * 0.04);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 6000;
    const g = this.ctx.createGain();
    g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.musicGain);
    src.start(when);
  },

  // authored-song voices, routed to the music bus
  playSong(song, step, when, dur) {
    const mk = (freq, type, vol, len) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, when);
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(vol, when + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, when + len);
      o.connect(g); g.connect(this.musicGain);
      o.start(when); o.stop(when + len + 0.02);
    };
    const lead = song.lead[step];
    if (lead) mk(lead.f, song.leadType, lead.v || 0.16, dur * (lead.len || 1) * 0.92);
    const bass = song.bass[step];
    if (bass) mk(bass.f, song.bassType, bass.v || 0.3, dur * (bass.len || 1) * 0.95);
    if (song.chord && song.chord[step]) {
      const ch = song.chord[step];
      for (let i = 0; i < ch.length; i++) mk(ch[i], song.chordType || 'triangle', 0.05, dur * 3.6);
    }
    if (song.perc) song.perc(step, when, dur, this);
  },

  mbeep(when, freq, len, type, vol) {
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, when + len);
    o.connect(g); g.connect(this.musicGain);
    o.start(when); o.stop(when + len + 0.02);
  },

  mnoise(when, vol, hp, len) {
    const l = Math.max(1, Math.floor(this.ctx.sampleRate * len));
    const buf = this.ctx.createBuffer(1, l, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < l; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / l);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp;
    const g = this.ctx.createGain();
    g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.musicGain);
    src.start(when);
  },
};

/* -- 7. FX -----------------------------------------------------------------
   Particles are 1-2px grid-aligned squares. Shake is floored to whole pixels
   so it never introduces sub-pixel drift.                                   */

const FX = {
  parts: [],
  numbers: [],
  shake: 0,
  hitstop: 0,
  flash: 0,
  flashColor: '#ffffff',
  reducedMotion: load('reducedMotion', false) ||
    (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches),

  addShake(amount) { if (!this.reducedMotion) this.shake = Math.min(9, this.shake + amount); },
  addHitstop(frames) { if (!this.reducedMotion) this.hitstop = Math.max(this.hitstop, frames); },
  addFlash(a, color) { if (this.reducedMotion) return; if (a >= this.flash) this.flashColor = color || '#ffffff'; this.flash = Math.max(this.flash, a); },

  burst(x, y, count, colors, speed, life, size) {
    if (this.reducedMotion) count = Math.ceil(count / 3);
    for (let i = 0; i < count; i++) {
      if (this.parts.length > 420) break;
      const a = rand(0, TAU), s = rand(speed * 0.3, speed);
      this.parts.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rand(life * 0.5, life), maxLife: life,
        color: pick(colors), size: size || 1, grav: 0,
      });
    }
  },

  trail(x, y, color) {
    if (this.reducedMotion || this.parts.length > 420) return;
    this.parts.push({ x, y, vx: rand(-.2, .2), vy: rand(-.2, .2), life: 8, maxLife: 8, color, size: 1, grav: 0 });
  },

  number(x, y, text, color) {
    if (this.numbers.length > 40) return;
    this.numbers.push({ x, y, text: String(text), color, life: 34, vy: -0.55 });
  },

  update() {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.92; p.vy *= 0.92; p.vy += p.grav;
      if (--p.life <= 0) this.parts.splice(i, 1);
    }
    for (let i = this.numbers.length - 1; i >= 0; i--) {
      const n = this.numbers[i];
      n.y += n.vy; n.vy *= 0.93;
      if (--n.life <= 0) this.numbers.splice(i, 1);
    }
    this.shake *= 0.86;
    if (this.shake < 0.2) this.shake = 0;
    this.flash *= 0.84;
    if (this.flash < 0.02) this.flash = 0;
    if (this.hitstop > 0) this.hitstop--;
  },

  clear() { this.parts.length = 0; this.numbers.length = 0; this.shake = 0; this.hitstop = 0; this.flash = 0; },

  shakeOffset() {
    if (this.shake <= 0) return { x: 0, y: 0 };
    return {
      x: Math.round(rand(-this.shake, this.shake)),
      y: Math.round(rand(-this.shake, this.shake)),
    };
  },
};

  if (c.effect === 'team') Game.teamBuff = Math.max(Game.teamBuff, 360);
  else if (c.effect === 'ammo') {
    for (let i = 1; i < p.ammo.length; i++) if (p.unlocked[i]) p.ammo[i] = Math.min(WEAPONS[i].maxAmmo, p.ammo[i] + Math.ceil(WEAPONS[i].maxAmmo * 0.2));

  return bag.pop();

  if (Game.party.length >= 5) return false;
  const preferred = ENEMY_MEMBERS[type] && ENEMY_MEMBERS[type].id;
  let id = preferred && Game.party.indexOf(preferred) < 0 ? preferred : RECRUIT_ORDER.find(x => Game.party.indexOf(x) < 0);
  if (!id) return false;
  Game.party.push(id);
  Game.rescueProgress = 0;

  if (p.caring) p.hp = Math.min(p.maxHp, p.hp + 12);

  setHint(RECRUIT_NAMES[id] + ' ANSWERED THE PING  ' + Game.party.length + '/5', 180);

function bailPartyMember(forcedId) {
  if (Game.party.length < 2) return false;
  const eligible = Game.party.slice(1);
  const id = forcedId && eligible.indexOf(forcedId) >= 0 ? forcedId : pick(eligible);
  Game.party.splice(Game.party.indexOf(id), 1);

  if (Game.inSecret || Game.party.length >= 5 || !ENEMY_MEMBERS[type]) return;

/* -- collision ------------------------------------------------------------ */

// Push a circle out of an axis-aligned rect. Returns true if it moved.
function resolveRect(e, rect) {
  const nx = clamp(e.x, rect.x, rect.x + rect.w);
  const ny = clamp(e.y, rect.y, rect.y + rect.h);
  const dx = e.x - nx, dy = e.y - ny;
  const d2 = dx * dx + dy * dy;
  if (d2 >= e.r * e.r) return false;
  if (d2 > 0.0001) {
    const d = Math.sqrt(d2);
    e.x = nx + (dx / d) * e.r;
    e.y = ny + (dy / d) * e.r;
  } else {
    // dead centre: eject along the shallowest axis
    const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    if (Math.abs(e.x - cx) > Math.abs(e.y - cy)) e.x = e.x > cx ? rect.x + rect.w + e.r : rect.x - e.r;
    else e.y = e.y > cy ? rect.y + rect.h + e.r : rect.y - e.r;
  }
  return true;
}

function collideWorld(e) {
  for (const o of Game.obstacles) resolveRect(e, o);
  e.x = clamp(e.x, e.r, Game.arenaW - e.r);
  e.y = clamp(e.y, e.r, Game.arenaH - e.r);
}

function pointInRects(x, y, pad) {
  for (const o of Game.obstacles) {
    if (x > o.x - pad && x < o.x + o.w + pad && y > o.y - pad && y < o.y + o.h + pad) return true;
  }
  return false;
}

function bulletBlocked(b) {
  if (b.x < 0 || b.y < 0 || b.x > Game.arenaW || b.y > Game.arenaH) return true;
  for (const o of Game.obstacles) {
    if (b.x > o.x && b.x < o.x + o.w && b.y > o.y && b.y < o.y + o.h) return true;
  }
  return false;
}

/* -- spawning ------------------------------------------------------------- */

function spawnEnemy(type, x, y) {
  const t = ENEMY_TYPES[type];
  const hard = Game.cModifier && Game.cModifier.id === 'l' && !t.boss;
  const e = {
    type, x, y, vx: 0, vy: 0,
    r: t.r, hp: t.hp * (hard ? 1.2 : 1), maxHp: t.hp * (hard ? 1.2 : 1),
    speed: t.speed, dmg: t.dmg * (hard ? 1.15 : 1), score: t.score,
    w: t.w, h: t.h, sprite: t.sprite,
    flash: 0, hitCd: 0, flip: false, anim: rand(0, 100),
    fireCd: randInt(30, t.fireRate || 90),
    fuse: -1, phase: 1, phaseT: 0, atkT: 0, spiral: 0,
    laser: -1, laserA: 0, charge: 0, chargeVX: 0, chargeVY: 0,
    boss: !!t.boss, spawnIn: 14,
  };
  Game.enemies.push(e);
  return e;
}

// Somewhere on the arena edge-ish, clear of walls and not on top of the player.
function findSpawnPoint(minDistFromPlayer) {
  const p = Game.player;
  for (let i = 0; i < 60; i++) {
    const x = rand(28, Game.arenaW - 28);
    const y = rand(28, Game.arenaH - 28);
    if (pointInRects(x, y, 12)) continue;
    if (dist2(x, y, p.x, p.y) < minDistFromPlayer * minDistFromPlayer) continue;
    return { x, y };
  }
  return { x: clamp(p.x + 140, 24, Game.arenaW - 24), y: clamp(p.y + 90, 24, Game.arenaH - 24) };
}

function queueWave(wave) {
  const q = [];
  for (const type in wave) for (let i = 0; i < wave[type]; i++) q.push(type);
  // shuffle so types arrive interleaved rather than in blocks
  for (let i = q.length - 1; i > 0; i--) { const j = randInt(0, i); const t = q[i]; q[i] = q[j]; q[j] = t; }
  Game.spawnQueue = q;
  Game.spawnTimer = 18;
}

function dropPickup(x, y, kind, weaponId, quoteId) {
  Game.pickups.push({ x, y, kind, weaponId: weaponId === undefined ? -1 : weaponId, quoteId: quoteId || null, bob: rand(0, TAU), life: 1800 });
}

function startLevel(index) {
  const L = LEVELS[index];
  Game.inSecret = null;

  Game.arenaW = L.w; Game.arenaH = L.h;
  Game.obstacles = L.obstacles.map(o => ({ x: o[0], y: o[1], w: o[2], h: o[3], kind: o[4] || null }));
  Game.enemies.length = 0;
  Game.bullets.length = 0;
  Game.eBullets.length = 0;
  Game.pickups.length = 0;
  Game.waveIndex = 0;
  Game.spawnQueue = [];
  Game.waveGap = 40;
  Game.bossSpawned = false;
  Game.boss = null;
  Game.levelTime = 0;
  Game.endTimer = 0;
  Game.cameoTriggered = false;
  Game.ungoonTags.length = 0;
  if (Game.party.length === 5 && index >= 1 && Game.lastBailLevel !== index) Game.bailTimer = 60 * 20;
  else if (Game.party.length < 5) Game.bailTimer = 0;
  FX.clear();

  const p = Game.player;
  p.x = L.w / 2; p.y = L.h / 2;
  p.vx = p.vy = 0;
  p.invuln = 60;
  p.dashCharges = p.dashMax;
  p.dashCd = 0;

  Game.cam.x = clamp(p.x - VW / 2, 0, Math.max(0, L.w - VW));
  Game.cam.y = clamp(p.y - VH / 2, 0, Math.max(0, L.h - VH));

  Game.bg = bakeBackground(L);
  Game.secretPortal = portalForLevel(index);

  if (L.drop) {
    const wi = WEAPON_BY_ID[L.drop];
    const pt = findSpawnPoint(60);
    dropPickup(pt.x, pt.y, 'weapon', wi);
  }

  Snd.startMusic(L.scale, false);
  setHint(L.name + (Game.cModifier ? '  C STANDS FOR ' + Game.cModifier.name : ''), 180);
  queueWave(L.waves[0]);
}

// Floor + walls are baked once per level into an arena-sized canvas, so the
// background costs a single drawImage per frame instead of a tile loop.
function bakeBackground(L) {
  const c = makeCanvas(L.w, L.h);
  const g = c.getContext('2d');
  g.fillStyle = L.floor;
  g.fillRect(0, 0, L.w, L.h);

  // dithered tile grid
  g.fillStyle = L.accent;
  for (let y = 0; y < L.h; y += 16) {
    for (let x = 0; x < L.w; x += 16) {
      if (((x / 16) + (y / 16)) % 2 === 0) {
        g.globalAlpha = 0.16;
        g.fillRect(x, y, 16, 16);
      }
      g.globalAlpha = 0.30;
      g.fillRect(x, y, 1, 1);
    }
  }
  g.globalAlpha = 1;

  // Animal Crossing dressing for cait's island
  if (L.island) {
    g.fillStyle = '#3f8fd0'; g.fillRect(0, 44, L.w, 30);
    g.fillStyle = '#6fbce8';
    for (let x = 0; x < L.w; x += 8) g.fillRect(x + (((x / 8) % 2) ? 2 : 5), 52 + (((x / 8) % 3) * 4), 3, 1);
    g.fillStyle = '#0a0810'; g.fillRect((L.w >> 1) - 26, 40, 52, 40);
    g.fillStyle = '#8a5a2a'; g.fillRect((L.w >> 1) - 24, 42, 48, 36);
    g.fillStyle = '#a5713a';
    for (let i = 0; i < 6; i++) g.fillRect((L.w >> 1) - 22 + i * 8, 42, 2, 36);
    const tree = (x, y) => {
      g.fillStyle = '#3a2a15'; g.fillRect(x - 2, y, 4, 10);
      g.fillStyle = '#256b25'; g.fillRect(x - 11, y - 18, 22, 20);
      g.fillStyle = '#3f9a3f'; g.fillRect(x - 9, y - 16, 18, 9);
      g.fillStyle = '#2f7a2f'; g.fillRect(x - 6, y + 8, 12, 3);
    };
    tree(70, 150); tree(650, 160); tree(90, 440); tree(640, 450); tree(360, 130);
    const fc = ['#ff5a7a', '#ffd24a', '#f2f2f2', '#c86bff', '#ff8a3a'];
    for (let i = 0; i < 46; i++) {
      const fx = 40 + (i * 97) % (L.w - 80);
      const fy = 100 + (i * 173) % (L.h - 170);
      g.fillStyle = fc[i % 5]; g.fillRect(fx, fy, 4, 4);
      g.fillStyle = '#ffe94a'; g.fillRect(fx + 1, fy + 1, 2, 2);
    }
    g.fillStyle = '#eef0e6'; g.fillRect(120, 300, 8, 10);
    g.fillStyle = '#c8d0b8'; g.fillRect(120, 306, 8, 4);
    g.fillStyle = '#3f9a3f'; g.fillRect(122, 296, 2, 5); g.fillRect(126, 296, 2, 5);
  }

  if (L.name === 'THE AUX BATTLE') {
    g.fillStyle = '#090611'; g.fillRect(L.w / 2 - 66, 18, 132, 34);
    g.fillStyle = '#5a2f8f'; g.fillRect(L.w / 2 - 64, 20, 128, 30);
    g.fillStyle = '#120a20'; g.fillRect(L.w / 2 - 61, 23, 122, 24);
    drawText(g, 'G ONE 2', L.w / 2, 28, '#f5c542', 'center', 2);
    drawText(g, 'FISH  1     CHIPS  2', L.w / 2, 41, '#9d72db', 'center');
  }

  // Feed Tower follows Dust II's actual macro layout: B/upper tunnels on the
  // left, CT and mid in the centre, A/Long on the right, T spawn below.
  if (L.dust2) {
    g.fillStyle = '#d7af76';

    g.fillRect(318, 126, 184, 102);                       // CT spawn and mid mouth
    g.fillRect(610, 128, 172, 100);                       // A site
    g.fillRect(18, 448, 330, 102);                        // lower tunnels
    g.fillRect(320, 228, 180, 430);                       // mid to T spawn
    g.fillRect(404, 488, 378, 72); g.fillRect(658, 214, 124, 348); // Long A

    g.fillRect(32, 48, 132, 132);                         // B site
    g.fillRect(622, 48, 160, 132);                        // A site platform
    g.fillRect(278, 658, 236, 84);                        // T spawn
    g.fillStyle = '#b57f4e';
    g.beginPath();                                        // catwalk / short A
    g.moveTo(452, 220); g.lineTo(610, 128); g.lineTo(638, 168);
    g.lineTo(480, 260); g.closePath(); g.fill();
    g.fillStyle = '#67452f';
    g.fillRect(376, 226, 5, 45); g.fillRect(420, 226, 5, 45);
    g.fillStyle = '#30231d'; g.fillRect(382, 229, 37, 39); // mid double doors
    g.fillStyle = '#c53f35';
    drawText(g, 'B', 98, 86, '#c53f35', 'center', 3);
    drawText(g, 'A', 704, 86, '#c53f35', 'center', 3);
    drawText(g, 'CT START', 410, 148, '#765038', 'center');
    drawText(g, 'T START', 396, 704, '#765038', 'center');

    drawText(g, 'DE_DUST2  FACEIT 10', L.w / 2, L.h - 10, '#765038', 'center');
    for (const [x, y] of [[112, 132], [145, 204], [682, 124], [742, 158], [92, 495], [464, 632], [696, 520]]) {
      g.fillStyle = '#765038'; g.fillRect(x - 9, y - 9, 18, 18);

  g.fillRect(0, 0, 4, L.h); g.fillRect(L.w - 4, 0, 4, L.h);
  g.fillStyle = L.accent;
  g.fillRect(0, 4, L.w, 1); g.fillRect(0, L.h - 5, L.w, 1);
  g.fillRect(4, 0, 1, L.h); g.fillRect(L.w - 5, 0, 1, L.h);

  return c;
}

function drawObstacle(g, o, L, camX, camY) {
  const x = Math.floor(o.x - camX), y = Math.floor(o.y - camY);
  if (L.dust2 && o.kind === 'void') {
    g.fillStyle = '#070707'; g.fillRect(x, y, o.w, o.h);
    g.fillStyle = '#62442f'; g.fillRect(x, y, o.w, 3);
    g.fillStyle = '#1a130f'; g.fillRect(x, y + o.h - 3, o.w, 3);
    return;
  }
  g.fillStyle = '#0a0810';
  g.fillRect(x + 1, y + 3, o.w, o.h);       // drop shadow
  g.fillStyle = L.wall;
  g.fillRect(x, y, o.w, o.h);
  g.fillStyle = L.accent;
  g.fillRect(x, y, o.w, 2);                  // lit top edge
  g.fillStyle = '#0d0b14';
  g.fillRect(x, y + o.h - 2, o.w, 2);
  if (L.dust2) {
    g.fillStyle = '#5e3e2b';
    for (let i = 3; i < Math.min(o.w, o.h) - 2; i += 5) {
      g.fillRect(x + i, y + i, 2, 2);
      g.fillRect(x + o.w - i - 2, y + i, 2, 2);
    }
  }
}

function renderQuoteWalls(g, camX, camY) {
  const known = QUOTE_BANK.filter(q => Game.discoveredQuotes.indexOf(q.id) >= 0);
  const samples = known.length ? known : [{ who: 'NILE', text: 'THE WALLS ARE WAITING.' }];
  const spots = [[78, 92], [390, 76], [610, 172], [72, 330], [360, 404], [630, 354]];
  g.save(); g.globalAlpha = 0.42;
  for (let i = 0; i < spots.length; i++) {
    const q = samples[i % samples.length];
    const x = Math.floor(spots[i][0] - camX), y = Math.floor(spots[i][1] - camY);
    drawText(g, q.who + ': ' + q.text.slice(0, 25), x, y, i % 2 ? '#ff8de0' : '#b48ce0');
  }
  g.restore();
}

function renderAuxEqualizer(g, camX, camY) {
  const baseX = 202 - camX, baseY = 332 - camY;
  for (let i = 0; i < 24; i++) {
    const beat = Math.sin(Game.frames * 0.12 + i * 0.73) * 0.5 + 0.5;
    const h = 5 + Math.floor(beat * (12 + (i % 5) * 3));
    g.fillStyle = i % 3 === 0 ? '#f5c542' : i % 2 ? '#5f82ff' : '#b45cff';
    for (let y = 0; y < h; y += 4) g.fillRect(Math.floor(baseX + i * 12), Math.floor(baseY - y), 8, 2);
  }
}

function bakeSecretBackground(def) {
  const c = makeCanvas(VW, VH);
  const g = c.getContext('2d');
  g.fillStyle = def.floor; g.fillRect(0, 0, VW, VH);
  g.fillStyle = def.accent;
  for (let y = 8; y < VH; y += 16) for (let x = 8; x < VW; x += 16) {
    if (((x + y) / 16) % 2 === 0) g.fillRect(x, y, 2, 2);
  }
  g.fillStyle = def.wall;
  g.fillRect(0, 0, VW, 5); g.fillRect(0, VH - 5, VW, 5);
  g.fillRect(0, 0, 5, VH); g.fillRect(VW - 5, 0, 5, VH);
  if (def === SECRET_ROOMS.outside) {
    g.fillStyle = '#101c32'; g.fillRect(176, 54, 128, 164);
    g.fillStyle = def.accent;
    g.fillRect(174, 52, 132, 2); g.fillRect(174, 218, 132, 2);
    drawText(g, 'THINK OUTSIDE IT', VW / 2, 230, '#5c7da8', 'center');
  } else if (def === SECRET_ROOMS.connor) {
    for (let i = 0; i < 24; i++) {
      g.fillStyle = i % 3 ? '#732637' : '#ff536f';
      g.fillRect((i * 67) % VW, 42 + (i * 43) % 184, 34, 3);
    }
    drawText(g, 'PROJECTILES HAVE BEEN MUTED', VW / 2, 230, '#ff899c', 'center');
  } else {
    for (let i = 0; i < 18; i++) {
      g.fillStyle = i % 2 ? '#ff6bd0' : '#6b2d70';
      g.fillRect((i * 83) % VW, 48 + (i * 37) % 170, 24 + (i % 4) * 7, 2);
    }
    drawText(g, 'IS THIS ON?', VW / 2, 230, '#ff9de0', 'center');
  }
  return c;
}

function enterSecretRoom(kind) {
  const def = SECRET_ROOMS[kind];

  Game.secretReturn = {
    arenaW: Game.arenaW, arenaH: Game.arenaH, obstacles: Game.obstacles,
    enemies: Game.enemies, bullets: Game.bullets, eBullets: Game.eBullets, pickups: Game.pickups,

    playerX: Game.player.x, playerY: Game.player.y,
  };

  Game.secretPortal = null;
  Game.arenaW = VW; Game.arenaH = VH;

  Game.enemies = []; Game.bullets = []; Game.eBullets = []; Game.pickups = [];
  Game.waveIndex = 0; Game.spawnQueue = []; Game.waveGap = 30; Game.bossSpawned = false; Game.boss = null;

  Game.player.x = VW / 2; Game.player.y = VH - 34; Game.player.vx = Game.player.vy = 0; Game.player.invuln = 70;

function completeSecretRoom() {
  if (!Game.inSecret || Game.inSecret.clearing) return;

function bossSong(type) {

function exitSecretRoom() {

function updateSecretPortal() {
  const po = Game.secretPortal;
  if (!po) return;
  const near = dist2(Game.player.x, Game.player.y, po.x, po.y) < 24 * 24;
