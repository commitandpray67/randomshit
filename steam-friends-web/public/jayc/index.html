  if (Game.puppy?.found && !Game.puppy.retired) placePuppy(true);
  Game.secretPortal = portalForLevel(Game.level);
  const L = LEVELS[Game.level];
  Snd.startMusic(L.scale, !!Game.boss, Game.boss ? bossSong(Game.boss.type) : null);
  Game.state = 'PLAY';
  setHint(def.reward || 'BACK IN ' + L.name, 180);
}

function updateSecretPortal() {
  const po = Game.secretPortal;
  if (!po) return;
  const near = dist2(Game.player.x, Game.player.y, po.x, po.y) < 24 * 24;
  if (near) {
    setHint('E  ENTER ' + SECRET_ROOMS[po.kind].name, 8);
    if (Input.hit('KeyE')) enterSecretRoom(po.kind);
  }
}

/* -- 11. UPDATE ------------------------------------------------------------ */

let entityId = 0;

function mouseWorld() {
  return { x: Input.mx + Game.cam.x, y: Input.my + Game.cam.y };
}

function updatePlayer() {
  const p = Game.player;
  const m = mouseWorld();
  p.aim = angleTo(p.x, p.y, m.x, m.y);

  // facing picks one of three authored sprites; side is mirrored for left
  const ax = Math.cos(p.aim), ay = Math.sin(p.aim);
  if (Math.abs(ay) > Math.abs(ax) * 1.25) { p.facing = ay > 0 ? 'down' : 'up'; }
  else { p.facing = 'side'; p.flip = ax < 0; }

  const mv = Input.moveVector();

  // dash
  if (p.dashT > 0) {
    p.dashT--;
    const ds = 3.9 * (p.dashT / 12) + 1.6;
    p.vx = Math.cos(p.dashAngle) * ds;
    p.vy = Math.sin(p.dashAngle) * ds;
    if (p.dashT % 2 === 0) FX.trail(p.x, p.y, '#4fb8e8');
  } else {
    const accel = 0.42, friction = 0.76;
    if (mv.x || mv.y) {
      p.vx += mv.x * accel; p.vy += mv.y * accel;
      const sp = Math.hypot(p.vx, p.vy);
      const moveCap = p.speed * (Game.grassBuff > 0 ? 1.35 : 1);
      if (sp > moveCap) { p.vx = p.vx / sp * moveCap; p.vy = p.vy / sp * moveCap; }
      p.walkT += 0.22;
    } else {
      p.vx *= friction; p.vy *= friction;
      p.walkT += 0.06;
    }
  }

  if (p.dashCd > 0) p.dashCd--;
  else if (p.dashCharges < p.dashMax) { p.dashCharges++; p.dashCd = p.dashCdMax; }

  if (Input.hit('Space') && p.dashCharges > 0 && p.dashT <= 0) {
    p.dashCharges--;
    if (p.dashCd <= 0) p.dashCd = p.dashCdMax;
    p.dashT = 12;
    p.dashAngle = (mv.x || mv.y) ? Math.atan2(mv.y, mv.x) : p.aim;
    p.invuln = Math.max(p.invuln, 14);
    FX.burst(p.x, p.y, 8, ['#9df3ff', '#4fb8e8'], 1.6, 14);
    Snd.dash();
  }

  p.x += p.vx; p.y += p.vy;
  collideWorld(p);
  updateSecretPortal();

  // walk animation: 4-beat cycle over the three authored leg poses
  const moving = Math.hypot(p.vx, p.vy) > 0.25;
  if (moving) {
    const f = Math.floor(p.walkT) % 4;
    p.legs = f === 1 ? 'a' : f === 3 ? 'b' : 'idle';
  } else {
    p.legs = 'idle';
  }
  p.bob = moving ? 0 : (Math.floor(Game.frames / 26) % 2);

  // weapon switching
  for (let i = 0; i < 4; i++) {
    if (Input.hit('Digit' + (i + 1)) && p.unlocked[i]) { p.weapon = i; Snd.select(); setHint(WEAPONS[i].name, 70); }
  }

  if (p.fireCd > 0) p.fireCd--;
  if (Input.down) firePlayer();

  if (Input.hit('KeyQ')) clarityBlast();

  if (p.invuln > 0) p.invuln--;

  // pickup magnetism
  for (const pk of Game.pickups) {
    const d2v = dist2(p.x, p.y, pk.x, pk.y);
    if (d2v < p.magnet * p.magnet) {
      const a = angleTo(pk.x, pk.y, p.x, p.y);
      const pull = 1.4;
      pk.x += Math.cos(a) * pull; pk.y += Math.sin(a) * pull;
    }
    if (d2v < 100) collectPickup(pk);
  }
  Game.pickups = Game.pickups.filter(pk => !pk.dead && --pk.life > 0);
}

function firePlayer() {
  const p = Game.player;
  if (p.fireCd > 0) return;
  let W = WEAPONS[p.weapon];
  if (p.ammo[p.weapon] <= 0) {
    p.weapon = 0;                       // out of ammo: fall back to the pistol
    W = WEAPONS[0];
    setHint('OUT OF AMMO - FOCUS PISTOL', 70);
  }
  const teamRate = Game.teamBuff > 0 ? 0.80 : 1;
  p.fireCd = Math.max(2, Math.round(W.rof * p.rofMul * teamRate));
  if (p.ammo[p.weapon] !== Infinity) p.ammo[p.weapon]--;

  const ox = p.x + Math.cos(p.aim) * 9;
  const oy = p.y + Math.sin(p.aim) * 9;
  for (let i = 0; i < W.pellets; i++) {
    const a = p.aim + rand(-W.spread, W.spread);
    Game.bullets.push({
      x: ox, y: oy,
      vx: Math.cos(a) * W.speed, vy: Math.sin(a) * W.speed,
      dmg: W.dmg * p.dmgMul * (Game.teamBuff > 0 ? 1.25 : 1) * (Game.oneClipBuff > 0 ? 1.30 : 1) * (p.clutch && p.hp / p.maxHp < 0.35 ? 1.35 : 1), r: W.pierce ? 3 : 2,
      life: Math.round(W.range / W.speed),
      color: W.color, trail: W.trail,
      pierce: W.pierce + (p.pierceBonus || 0), knock: W.knock, hit: null,
    });
  }
  FX.burst(ox, oy, 3, [W.color, '#ffffff'], 1.3, 7);
  FX.addShake(W.shake);
  Snd[W.sfx]();
}

function clarityBlast() {
  const p = Game.player;
  if (p.clarity < p.clarityMax) { setHint('CLARITY NOT READY', 60); return; }
  p.clarity = 0;
  Game.eBullets.length = 0;
  Game.shockwave = { r: 4, life: 26 };
  for (const e of Game.enemies) {
    if (e.spawnIn > 0) continue;
    damageEnemy(e, e.boss ? 150 : 90, angleTo(p.x, p.y, e.x, e.y), 2.2);
  }
  FX.burst(p.x, p.y, 60, ['#ffffff', '#9df3ff', '#4fb8e8'], 4.2, 30);
  FX.addShake(8);
  FX.addFlash(0.8);
  FX.addHitstop(6);
  Snd.clarity();
  if (Math.random() < 0.65 || (Game.cModifier && Game.cModifier.id === 'catty')) winstonBark('clarity');
}

function collectPickup(pk) {
  const p = Game.player;
  if (pk.kind === 'quote') {
    unlockQuote(pk.quoteId, true);
  } else if (pk.kind === 'health') {
    if (p.hp >= p.maxHp) return;
    p.hp = Math.min(p.maxHp, p.hp + 22);
    FX.number(pk.x, pk.y, '+22', '#ff8da0');
  } else if (pk.kind === 'ammo') {
    const w = p.weapon === 0 ? bestAmmoWeapon() : p.weapon;
    if (w <= 0) return;
    const add = Math.ceil(WEAPONS[w].maxAmmo * 0.25);
    p.ammo[w] = Math.min(WEAPONS[w].maxAmmo, p.ammo[w] + add);
    FX.number(pk.x, pk.y, '+' + add, '#ffe6b0');
  } else if (pk.kind === 'weapon') {
    const w = pk.weaponId;
    p.unlocked[w] = true;
    p.ammo[w] = WEAPONS[w].maxAmmo;
    p.weapon = w;
    setHint(WEAPONS[w].name + ' ACQUIRED - KEY ' + (w + 1), 170);
  }
  pk.dead = true;
  FX.burst(pk.x, pk.y, 10, ['#ffffff', '#ffe6b0'], 1.7, 16);
  Snd.pickup();
}

function bestAmmoWeapon() {
  const p = Game.player;
  for (let i = 3; i >= 1; i--) if (p.unlocked[i]) return i;
  return -1;
}

function damagePlayer(dmg) {
  const p = Game.player;
  if (p.invuln > 0 || Game.state !== 'PLAY' || puppyRescueBusy()) return;
  p.hp -= dmg;
  p.invuln = 46;
  p.hurtFlash = 12;
  FX.addShake(3.4);
  FX.addFlash(0.16, '#c8324a');
  FX.burst(p.x, p.y, 12, ['#ff6b6b', '#ffffff'], 2.1, 18);
  Snd.hurt();
  if (Math.random() < (Game.cModifier && Game.cModifier.id === 'catty' ? 0.75 : 0.32)) winstonBark('hurt');
  if (p.hp <= 0) {
    p.hp = 0;
    FX.burst(p.x, p.y, 40, ['#ff6b6b', '#ffffff', '#9df3ff'], 3.4, 34);
    FX.addShake(8);
    Snd.explode();
    Snd.stopMusic();
    unlockAchievement('embarrassing');
    Game.state = 'GAMEOVER';
    Game.endTimer = 0;
  }
}

function damageEnemy(e, dmg, knockA, knock) {
  if (e.dead) return;
  e.hp -= dmg;
  e.flash = 4;
  const t = ENEMY_TYPES[e.type];
  if (knock) {
    const resist = 1 - (t.knockResist || 0);
    e.vx += Math.cos(knockA) * knock * resist;
    e.vy += Math.sin(knockA) * knock * resist;
  }
  if (!(e.rescueMob && puppyRescueBusy())) FX.number(e.x + rand(-3, 3), e.y - e.r - 2, Math.round(dmg), e.boss ? '#ffd6f2' : '#ffe9a8');
  if (e.boss) Snd.bossHit(); else Snd.hit();
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  const p = Game.player;
  Game.score += Math.round(e.score * (p.scoreMul || 1));
  Game.kills++;
  p.clarity = Math.min(p.clarityMax, p.clarity + (e.boss ? 30 : 7) * p.clarityRate);
  if (p.leech) p.hp = Math.min(p.maxHp, p.hp + p.leech);

  const pal = ENEMY_PALS[e.sprite];
  const colors = [pal.b, pal.g || pal.c, pal.c || '#ffffff', '#ffffff'];
  FX.burst(e.x, e.y, e.boss ? 90 : 16, colors, e.boss ? 4.2 : 2.3, e.boss ? 40 : 22, 1);

  if (e.boss) {
    FX.addShake(9); FX.addFlash(0.5); FX.addHitstop(14);
    Snd.explode();
    Game.boss = null;
    if (e.type === 'harold') unlockAchievement('vertigone');
  } else {
    addUngoonTag(e);
    maybeAdvanceRescue(e.type);
    Snd.kill();
    if (Math.random() < 0.11) dropPickup(e.x, e.y, 'health');
    else if (Math.random() < 0.20 && bestAmmoWeapon() > 0) dropPickup(e.x, e.y, 'ammo');
    else if (Math.random() < 0.08) {
      const unseen = undiscoveredQuotes();
      if (unseen.length) dropPickup(e.x, e.y, 'quote', -1, pick(unseen).id);
    }
  }
  if (ENEMY_TYPES[e.type].explodes) explodePopper(e);
}

function explodePopper(e) {
  // Rescue poppers burst visually without deleting the crowd in a chain reaction.
  if (e.rescueMob && puppyRescueBusy()) {
    FX.burst(e.x, e.y, 10, ['#ff6b4a', '#ffe9a8'], 1.8, 16);
    return;
  }
  const t = ENEMY_TYPES[e.type];
  FX.burst(e.x, e.y, 34, ['#ff6b4a', '#ffe9a8', '#ffffff'], 3.4, 26);
  FX.addShake(4.2);
  Snd.explode();
  const p = Game.player;
  if (dist2(p.x, p.y, e.x, e.y) < t.blast * t.blast) damagePlayer(t.blastDmg);
  for (const o of Game.enemies) {
    if (o === e || o.dead || o.boss) continue;
    if (dist2(o.x, o.y, e.x, e.y) < t.blast * t.blast) {
      damageEnemy(o, t.blastDmg, angleTo(e.x, e.y, o.x, o.y), 2.4);
    }
  }
}

function enemyShoot(e, angle, speed, dmg, color, r, kind) {
  Game.eBullets.push({
    x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    dmg, r: r || 3, life: 300, color: color || '#ff8de0',
    kilij: !!(e && e.type === 'mustie'),
    seaBass: kind === 'seaBass',
    flower: !!(e && e.type === 'cait' && kind !== 'seaBass'),
    ak: !!(e && e.type === 'harold'),
    vinyl: !!(e && e.type === 'werder'),
  });
}

/* -- committed enemy detours ---------------------------------------------- */

const NPC_NAV = { clearFrames: 12, retryFrames: 75 };
let npcNavCache = { signature: '', graphs: new Map() };

// Circle clearance agrees with collideWorld, including rounded cover corners.
// Check segment/rectangle intersection, then its nearest edge/corner distance.
function npcClearPath(ax, ay, bx, by, radius) {
  if (Math.min(ax, bx) < radius || Math.min(ay, by) < radius ||
      Math.max(ax, bx) > Game.arenaW - radius || Math.max(ay, by) > Game.arenaH - radius) return false;
  for (const o of Game.obstacles) {
    let near = 0, far = 1;
    for (const [a, b, low, high] of [
      [ax, bx, o.x, o.x + o.w],
      [ay, by, o.y, o.y + o.h],
    ]) {
      const delta = b - a;
      if (Math.abs(delta) < 0.00001) {
        if (a <= low || a >= high) { near = 2; break; }
      } else {
        const first = (low - a) / delta, last = (high - a) / delta;
        near = Math.max(near, Math.min(first, last));
        far = Math.min(far, Math.max(first, last));
      }
    }
    if (near < far && far > 0 && near < 1) return false;
    if (!radius) continue;
    let nearest = Math.min(
      dist2(ax, ay, clamp(ax, o.x, o.x + o.w), clamp(ay, o.y, o.y + o.h)),
      dist2(bx, by, clamp(bx, o.x, o.x + o.w), clamp(by, o.y, o.y + o.h)));
    const dx = bx - ax, dy = by - ay, length2 = dx * dx + dy * dy;
    for (const x of [o.x, o.x + o.w]) for (const y of [o.y, o.y + o.h]) {
      const amount = length2 ? clamp(((x - ax) * dx + (y - ay) * dy) / length2, 0, 1) : 0;
      nearest = Math.min(nearest, dist2(x, y, ax + dx * amount, ay + dy * amount));
    }
    if (nearest < radius * radius - 0.0001) return false;
  }
  return true;
}

function npcObstacleGraph(radius) {
  const signature = [Game.arenaW, Game.arenaH,
    ...Game.obstacles.flatMap(o => [o.x, o.y, o.w, o.h])].join(',');
  if (npcNavCache.signature !== signature) npcNavCache = { signature, graphs: new Map() };
  if (npcNavCache.graphs.has(radius)) return npcNavCache.graphs.get(radius);
  const points = [], margin = radius + 1;
  for (const o of Game.obstacles) {
    for (const x of [o.x - margin, o.x + o.w + margin]) {
      for (const y of [o.y - margin, o.y + o.h + margin]) {
        if (npcClearPath(x, y, x, y, radius)) points.push({ x, y });
      }
    }
  }
  const edges = points.map(() => []);
  for (let i = 0; i < points.length; i++) {
    for (let j = i + 1; j < points.length; j++) {
      const a = points[i], b = points[j];
      if (!npcClearPath(a.x, a.y, b.x, b.y, radius)) continue;
      const cost = Math.hypot(a.x - b.x, a.y - b.y);
      edges[i].push({ to: j, cost }); edges[j].push({ to: i, cost });
    }
  }
  const graph = { points, edges };
  npcNavCache.graphs.set(radius, graph);
  return graph;
}

function npcRouteTo(e, target) {
  const radius = e.r, graph = npcObstacleGraph(radius);
  // A brute cannot occupy every spot that smaller JayC/Bracken can. Stop at
  // a reachable engagement point instead of demanding their exact centre.
  const destinations = [];
  if (npcClearPath(target.x, target.y, target.x, target.y, radius)) destinations.push({ x: target.x, y: target.y });
  else for (const distance of [radius / 2, radius + 1]) {
    for (let i = 0; i < 16; i++) {
      const angle = i * Math.PI / 8, x = target.x + Math.cos(angle) * distance, y = target.y + Math.sin(angle) * distance;
      if (npcClearPath(x, y, x, y, radius) && npcClearPath(x, y, target.x, target.y, 0)) destinations.push({ x, y });
    }
  }
  if (!destinations.length) return [];
  const start = graph.points.length, goal = start + destinations.length + 1;
  const points = [...graph.points, { x: e.x, y: e.y }, ...destinations, { x: target.x, y: target.y }];
  const edges = graph.edges.map(list => list.slice());
  for (let i = start; i <= goal; i++) edges.push([]);
  for (let id = start; id < goal; id++) {
    const a = points[id];
    for (let j = 0; j <= Math.min(id - 1, start); j++) {
      const b = points[j];
      if (!npcClearPath(a.x, a.y, b.x, b.y, radius)) continue;
      const cost = Math.hypot(a.x - b.x, a.y - b.y);
      edges[id].push({ to: j, cost }); edges[j].push({ to: id, cost });
    }
    if (id !== start) edges[id].push({ to: goal, cost: Math.hypot(a.x - target.x, a.y - target.y) * 2 });
  }
  const costs = points.map(() => Infinity), previous = points.map(() => -1), closed = new Set();
  costs[start] = 0;
  while (closed.size < points.length) {
    let at = -1;
    for (let i = 0; i < points.length; i++) {
      if (!closed.has(i) && (at < 0 || costs[i] < costs[at])) at = i;
    }
    if (at < 0 || !Number.isFinite(costs[at])) break;
    if (at === goal) {
      const path = [];
      for (let id = previous[goal]; id !== start; id = previous[id]) path.unshift(points[id]);
      return path;
    }
    closed.add(at);
    for (const edge of edges[at]) {
      if (costs[at] + edge.cost >= costs[edge.to]) continue;
      costs[edge.to] = costs[at] + edge.cost; previous[edge.to] = at;
    }
  }
  return [];
}

function enemySteering(e, target) {
  const direct = angleTo(e.x, e.y, target.x, target.y);
  if (e.boss) return { angle: direct, routing: false };
  if (!e.nav) e.nav = { path: [], clear: 0, retry: 0, age: 0, x: e.x, y: e.y };
  const nav = e.nav, radius = e.r;
  if (nav.retry > 0) nav.retry--;
  const clear = npcClearPath(e.x, e.y, target.x, target.y, radius);
  nav.clear = clear ? nav.clear + 1 : 0;
  if (clear && (!nav.path.length || nav.clear >= NPC_NAV.clearFrames)) {
    nav.path = []; nav.retry = 0; nav.age = 0;
    return { angle: direct, routing: false };
  }
  // Keep the chosen side as JayC moves: no periodic shortest-path flipping.
  // Only abandon a route that became blocked, finished, or stopped making progress.
  nav.age++;
  if (nav.age >= 120) {
    if (dist2(e.x, e.y, nav.x, nav.y) < 9) { nav.path = []; nav.retry = 0; }
    nav.age = 0; nav.x = e.x; nav.y = e.y;
  }
  while (nav.path.length && dist2(e.x, e.y, nav.path[0].x, nav.path[0].y) < 9 &&
      (nav.path.length === 1 || npcClearPath(e.x, e.y, nav.path[1].x, nav.path[1].y, radius))) nav.path.shift();
  if (nav.path.length && !npcClearPath(e.x, e.y, nav.path[0].x, nav.path[0].y, e.r)) {
    nav.path = []; nav.retry = 0;
  }
  if (!nav.path.length && !nav.retry) {
    nav.path = npcRouteTo(e, target); nav.retry = NPC_NAV.retryFrames;
  }
  const next = nav.path[0];
  return next ? { angle: angleTo(e.x, e.y, next.x, next.y), routing: true } : { angle: direct, routing: false };
}

// Follow a committed corner precisely; inertial strafing otherwise cuts corners.
// The existing role acceleration still sets speed and recovers from knockback.
function steerEnemyVelocity(e, steering) {
  if (!steering.routing) return;
  const speed = Math.min(Math.hypot(e.vx, e.vy), e.speed * 1.65);
  const distance = Math.hypot(e.nav.path[0].x - e.x, e.nav.path[0].y - e.y);
  e.vx = Math.cos(steering.angle) * Math.min(speed, distance);
  e.vy = Math.sin(steering.angle) * Math.min(speed, distance);
}

function updateEnemies() {
  const p = Game.player;
  if (puppyRescueBusy() && ['distant', 'reveal', 'greeting'].includes(Game.puppyRescue.phase)) return;
  for (const e of Game.enemies) {
    if (e.dead) continue;
    if (e.spawnIn > 0) { e.spawnIn--; continue; }

    const t = ENEMY_TYPES[e.type];
    e.anim += 1;
    if (e.flash > 0) e.flash--;
    if (e.hitCd > 0) e.hitCd--;

    // The rescue crowd holds its ground: Bracken stays visible as he cuts through it.
    if (e.rescueMob && Game.puppyRescue?.phase === 'charge') {
      e.vx = e.vy = 0; e.flip = Game.puppy.x < e.x; continue;
    }
    // Stop the swarm in a threatening ring so JayC remains visible in the middle.
    if (e.rescueMob && Game.puppyRescue?.phase === 'swarm' && dist2(e.x, e.y, p.x, p.y) < 54 * 54) {
      e.vx = e.vy = 0; continue;
    }
    const target = puppyTargetFor(e);
    const steering = enemySteering(e, target), moveAngle = steering.angle;
    const toP = angleTo(e.x, e.y, target.x, target.y);
    const d = Math.sqrt(dist2(e.x, e.y, target.x, target.y));
    const playerDistance = Math.sqrt(dist2(e.x, e.y, p.x, p.y));
    if (!steering.routing || Math.abs(Math.cos(moveAngle)) > 0.15) e.flip = Math.cos(steering.routing ? moveAngle : toP) < 0;

    if (e.boss) {
      updateBoss(e, toP, d);
    } else if (t.ranged) {
      // hold at range and lob
      const want = t.keepAt;
      const dir = steering.routing ? 1 : d > want + 14 ? 1 : d < want - 14 ? -1 : 0;
      e.vx += Math.cos(moveAngle) * e.speed * 0.16 * dir;
      e.vy += Math.sin(moveAngle) * e.speed * 0.16 * dir;
      if (!steering.routing) {
        e.vx += Math.cos(toP + Math.PI / 2) * 0.05 * Math.sin(e.anim * 0.02);
        e.vy += Math.sin(toP + Math.PI / 2) * 0.05 * Math.sin(e.anim * 0.02);
      }
      if (--e.fireCd <= 0) {
        e.fireCd = t.fireRate;
        enemyShoot(e, toP + rand(-0.09, 0.09), 1.5, t.dmg, '#8dffb0');
      }
    } else if (t.explodes) {
      e.vx += Math.cos(moveAngle) * e.speed * 0.2;
      e.vy += Math.sin(moveAngle) * e.speed * 0.2;
      if (e.fuse < 0 && d < 26 && !(e.rescueMob && puppyRescueBusy())) { e.fuse = t.fuse; }
      if (e.fuse >= 0 && --e.fuse <= 0) { killEnemy(e); continue; }
    } else {
      let a = moveAngle;
      if (t.strafe && !steering.routing) a += Math.sin(e.anim * 0.045) * 0.7;
      e.vx += Math.cos(a) * e.speed * 0.2;
      e.vy += Math.sin(a) * e.speed * 0.2;
    }

    e.vx *= 0.88; e.vy *= 0.88;
    const cap = e.speed * 2.4;
    const sp = Math.hypot(e.vx, e.vy);
    if (sp > cap) { e.vx = e.vx / sp * cap; e.vy = e.vy / sp * cap; }
    steerEnemyVelocity(e, steering);
    e.x += e.vx; e.y += e.vy;
    collideWorld(e);

    // contact damage
    if ((t.contact || e.boss) && e.hitCd <= 0 && playerDistance < e.r + p.r + 2) {
      damagePlayer(t.dmg);
      e.hitCd = 30;
      const push = angleTo(p.x, p.y, e.x, e.y);
      e.vx -= Math.cos(push) * 1.6; e.vy -= Math.sin(push) * 1.6;
    }
  }

  // separate overlapping enemies so crowds do not stack into one pixel
  for (let i = 0; i < Game.enemies.length; i++) {
    const a = Game.enemies[i];
    if (a.dead || a.spawnIn > 0 || a.boss) continue;
    for (let j = i + 1; j < Game.enemies.length; j++) {
      const b = Game.enemies[j];
      if (b.dead || b.spawnIn > 0 || b.boss) continue;
      const rr = a.r + b.r;
      const d2v = dist2(a.x, a.y, b.x, b.y);
      if (d2v > 0.01 && d2v < rr * rr) {
        const dd = Math.sqrt(d2v);
        const push = (rr - dd) * 0.24;
        const nx = (b.x - a.x) / dd, ny = (b.y - a.y) / dd;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
  }

  // Crowd separation must not push a committed route back into solid cover.
  for (const e of Game.enemies) if (!e.dead && e.spawnIn <= 0 && !e.boss) collideWorld(e);
  Game.enemies = Game.enemies.filter(e => !e.dead);
}

/* -- bosses ---------------------------------------------------------------- */

function updateBoss(e, toP, d) {
  e.phaseT++;
  if (e.type === 'cait') updateCait(e, toP, d);
  else if (e.type === 'werder') updateWerder(e, toP, d);
  else if (e.type === 'harold') updateHarold(e, toP, d);
  else updateMustie(e, toP, d);
}

function updateCait(e, toP, d) {
  const half = e.maxHp * 0.5;
  const newPhase = e.hp > half ? 1 : 2;
  if (newPhase !== e.phase) {
    e.phase = newPhase; e.phaseT = 0; e.atkT = 0;
    FX.addShake(6); FX.addFlash(0.3);
    FX.burst(e.x, e.y, 44, ['#a8e063', '#fffbe6'], 3.2, 28);
    setHint('CAIT FLOODS THE ISLAND', 110);
    setBark('CAIT', 'I CAN EXPLAIN.', 150, true);
    Game.obamaT = 180;
  }

  // drift toward the player, never quite catching up
  const sp = e.speed * (e.phase === 2 ? 1.7 : 1);
  if (d > 46) { e.vx += Math.cos(toP) * sp * 0.2; e.vy += Math.sin(toP) * sp * 0.2; }

  e.atkT++;
  if (e.phase === 1) {
    if (e.atkT % 176 === 0) {
      setHint('SEA BASS BARRAGE', 100);
      for (let i = 0; i < 14; i++) enemyShoot(e, (i / 14) * TAU + e.spiral, 1.65, 14, '#7ad8ff', 4, 'seaBass');
      e.spiral += 0.18;
    }
    if (e.atkT % 104 === 0) {
      for (let i = 0; i < 12; i++) enemyShoot(e, (i / 12) * TAU + e.spiral, 1.5, 12, '#a8e063');
      e.spiral += 0.26;
      FX.addShake(2.4);
    }
    if (e.atkT % 212 === 0) { setHint('FROGGY CHAIR HOP', 80); summonAdds(e, 'froggy', 4); }
  } else {
    if (e.atkT % 7 === 0) {
      enemyShoot(e, e.spiral, 1.75, 12, '#eaf7c9');
      enemyShoot(e, e.spiral + Math.PI, 1.75, 12, '#eaf7c9');
      e.spiral += 0.42;
    }
    if (e.atkT % 188 === 0) { setHint('GALLANT STATUE - REAL OR FAKE?', 90); summonAdds(e, 'gallant', 2); summonAdds(e, 'froggy', 2); }
  }
}

function updateMustie(e, toP, d) {
  const third = e.maxHp / 3;
  const newPhase = e.hp > third * 2 ? 1 : e.hp > third ? 2 : 3;
  if (newPhase !== e.phase) {
    e.phase = newPhase; e.phaseT = 0; e.atkT = 0; e.charge = 0; e.laser = -1;
    FX.addShake(7); FX.addFlash(0.34); FX.addHitstop(8);
    FX.burst(e.x, e.y, 60, ['#f5c542', '#ffffff'], 3.6, 32);
    setHint(newPhase === 2 ? 'THE MEHTER QUICKENS' : 'FINAL MOVEMENT - ALLA TURCA', 130);
    setBark('MUSTIE', newPhase === 2 ? 'SKIMMED IS LIKE WATER.' : 'WHOLE MILK OR NOTHING.', 150, true);
  }

  e.atkT++;

  if (e.phase === 1) {
    if (d > 60) { e.vx += Math.cos(toP) * e.speed * 0.2; e.vy += Math.sin(toP) * e.speed * 0.2; }
    if (e.atkT % 6 === 0) {
      enemyShoot(e, e.spiral, 1.7, 14, '#f5c542');
      enemyShoot(e, e.spiral + TAU / 3, 1.7, 14, '#f5c542');
      enemyShoot(e, e.spiral + TAU * 2 / 3, 1.7, 14, '#f5c542');
      e.spiral += 0.31;
    }
    if (e.atkT % 300 === 0) summonAdds(e, 'janissary', 3);

  } else if (e.phase === 2) {
    // telegraph, then charge
    if (e.charge === 0 && e.atkT % 130 === 0) { e.charge = 46; e.chargeA = toP; }
    if (e.charge > 0) {
      e.charge--;
      if (e.charge > 26) {
        e.chargeA = lerp(e.chargeA, toP, 0.06);
        if (e.charge % 4 === 0) FX.burst(e.x, e.y, 4, ['#ffe9a8'], 1.4, 12);
      } else {
        e.vx += Math.cos(e.chargeA) * 0.72;
        e.vy += Math.sin(e.chargeA) * 0.72;
        FX.trail(e.x + rand(-8, 8), e.y + rand(-8, 8), '#e30a17');
      }
    } else if (d > 70) {
      e.vx += Math.cos(toP) * e.speed * 0.18; e.vy += Math.sin(toP) * e.speed * 0.18;
    }
    if (e.atkT % 22 === 0) {
      for (let i = 0; i < 5; i++) enemyShoot(e, toP + (i - 2) * 0.19, 1.6, 14, '#f5c542');
    }
    if (e.atkT % 260 === 0) summonAdds(e, 'janissary', 3);

  } else {
    // sweeping beam plus expanding rings
    if (e.laser < 0 && e.atkT % 190 === 0) { e.laser = 150; e.laserA = toP - 0.9; }
    if (e.laser > 0) {
      e.laser--;
      e.laserA += 0.016;
      const da = Math.abs(angleDiff(e.laserA, toP));
      if (da < 0.075 && d < 460 && Game.player.invuln <= 0) damagePlayer(16);
      if (e.laser === 0) e.laser = -1;
    }
    if (e.atkT % 5 === 0) {
      enemyShoot(e, e.spiral, 1.55, 15, '#ffe9a8');
      enemyShoot(e, e.spiral + Math.PI, 1.55, 15, '#ffe9a8');
      e.spiral += 0.51;
    }
    if (e.atkT % 120 === 0) {
      for (let i = 0; i < 18; i++) enemyShoot(e, (i / 18) * TAU, 1.25, 15, '#f5c542');
      FX.addShake(3);
    }
    if (e.atkT % 320 === 0) summonAdds(e, 'janissary', 4);
    if (d > 90) { e.vx += Math.cos(toP) * e.speed * 0.14; e.vy += Math.sin(toP) * e.speed * 0.14; }
  }
}

function updateWerder(e, toP, d) {
  const half = e.maxHp * 0.5;
  const newPhase = e.hp > half ? 1 : 2;
  if (newPhase !== e.phase) {
    e.phase = newPhase; e.phaseT = 0; e.atkT = 0;
    FX.addShake(6); FX.addFlash(0.3);
    FX.burst(e.x, e.y, 48, ['#5f82ff', '#f5c542'], 3.4, 30);
    setHint('WERDERDLEY DROPS THE BEAT', 110);
    setBark('WERDERDLEY', "KEEP TALKING JAMIE. YOU'RE JUST A SMALL MAN IN A TINY WORLD.", 180, true);
  }
  const sp = e.speed * (e.phase === 2 ? 1.6 : 1);
  if (d > 50) { e.vx += Math.cos(toP) * sp * 0.2; e.vy += Math.sin(toP) * sp * 0.2; }
  e.atkT++;
  if (e.phase === 1) {
    if (e.atkT % 96 === 0) {
      setHint('BINTED VINYL DROP', 70);
      for (let i = 0; i < 16; i++) enemyShoot(e, (i / 16) * TAU + e.spiral, 1.4, 13, '#5f82ff');
      e.spiral += 0.2; FX.addShake(2.4);
    }
    if (e.atkT % 34 === 0) for (let i = 0; i < 3; i++) enemyShoot(e, toP + (i - 1) * 0.22, 1.9, 12, '#f5c542');
    if (e.atkT % 220 === 0) summonAdds(e, 'sprinter', 3);
  } else {
    if (e.atkT % 6 === 0) {
      enemyShoot(e, e.spiral, 1.8, 13, '#f5c542');
      enemyShoot(e, e.spiral + Math.PI, 1.8, 13, '#f5c542');
      e.spiral += 0.5;
    }
    if (e.atkT % 90 === 0) {
      setHint('AUX CORD OVERLOAD', 70);
      for (let i = 0; i < 20; i++) enemyShoot(e, (i / 20) * TAU, 1.25, 13, '#5f82ff');
      FX.addShake(3);
    }
    if (e.atkT % 200 === 0) summonAdds(e, 'popper', 4);
  }
}

function updateHarold(e, toP, d) {
  const half = e.maxHp * 0.5;
  const newPhase = e.hp > half ? 1 : 2;
  if (newPhase !== e.phase) {
    e.phase = newPhase; e.phaseT = 0; e.atkT = 0;
    FX.addShake(6); FX.addFlash(0.3);
    FX.burst(e.x, e.y, 48, ['#e0504f', '#8a97b0'], 3.4, 30);
    setHint('HAROLD IS TILTED', 110);
    setBark('HAROLD', 'IM AN ACTUAL CS GENIUS.', 150, true);
    unlockAchievement('vod');
  }
  const sp = e.speed * (e.phase === 2 ? 1.7 : 1);
  if (d > 48) { e.vx += Math.cos(toP) * sp * 0.2; e.vy += Math.sin(toP) * sp * 0.2; }
  e.aim = toP;
  if (e.akFlash > 0) e.akFlash--;
  e.atkT++;
  if (e.phase === 1) {
    if (e.atkT % 48 < 20 && e.atkT % 4 === 0) { enemyShoot(e, toP, 2.5, 13, '#f2aa45'); e.akFlash = 4; }
    if (e.atkT % 150 === 0) { setHint('VERTIGO B-SITE HOLD', 80); for (let i = 0; i < 10; i++) enemyShoot(e, (i / 10) * TAU + e.spiral, 1.4, 12, '#8a97b0'); e.spiral += 0.3; e.akFlash = 4; }
    if (e.atkT % 240 === 0) { setHint('ONE-WAY SMOKE', 80); summonAdds(e, 'sprinter', 3); }
  } else {
    if (e.atkT % 5 === 0) { enemyShoot(e, e.spiral, 1.9, 13, '#f2aa45'); enemyShoot(e, e.spiral + Math.PI, 1.9, 13, '#f2aa45'); e.spiral += 0.44; e.akFlash = 4; }
    if (e.atkT % 70 === 0) { setHint('AK-47 SPRAY TRANSFER', 65); for (let i = 0; i < 5; i++) enemyShoot(e, toP + (i - 2) * 0.18, 2.2, 13, '#f2aa45'); e.akFlash = 4; }
    if (e.atkT % 210 === 0) { setHint('EMERGENCY FIFTH', 80); summonAdds(e, 'sprinter', 4); }
  }
}

function summonAdds(e, type, n) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + rand(0, 1);
    const x = clamp(e.x + Math.cos(a) * 44, 20, Game.arenaW - 20);
    const y = clamp(e.y + Math.sin(a) * 44, 20, Game.arenaH - 20);
    spawnEnemy(type, x, y);
    FX.burst(x, y, 10, ['#ffffff', '#8de5ff'], 1.8, 16);
  }
}

/* -- bullets & waves ------------------------------------------------------- */

function updateBullets() {
  const p = Game.player;

  for (const b of Game.bullets) {
    b.x += b.vx; b.y += b.vy;
    if (b.pierce) FX.trail(b.x, b.y, b.trail);
    else if (Game.frames % 2 === 0) FX.trail(b.x, b.y, b.trail);

    if (--b.life <= 0 || bulletBlocked(b)) {
      b.dead = true;
      FX.burst(b.x, b.y, 3, [b.color], 1.1, 8);
      continue;
    }
    for (const e of Game.enemies) {
      if (e.dead || e.spawnIn > 0) continue;
      const rr = e.r + b.r;
      if (dist2(b.x, b.y, e.x, e.y) < rr * rr) {
        if (b.hit && b.hit.indexOf(e) >= 0) continue;
        damageEnemy(e, b.dmg, Math.atan2(b.vy, b.vx), b.knock);
        FX.burst(b.x, b.y, 5, [b.color, '#ffffff'], 1.8, 10);
        if (b.pierce > 0) {
          b.pierce--;
          (b.hit || (b.hit = [])).push(e);
          FX.addHitstop(2);
        } else { b.dead = true; }
        break;
      }
    }
  }
  Game.bullets = Game.bullets.filter(b => !b.dead);

  for (const b of Game.eBullets) {
    b.x += b.vx; b.y += b.vy;
    if (Game.silenceBuff > 0 && dist2(b.x, b.y, p.x, p.y) < 58 * 58) {
      b.dead = true;
      FX.burst(b.x, b.y, 3, ['#ff536f', '#ffffff'], 1.0, 8);
      continue;
    }
    if (Game.frames % 3 === 0) FX.trail(b.x, b.y, b.color);
    if (--b.life <= 0 || bulletBlocked(b)) { b.dead = true; continue; }
    const rr = b.r + p.r;
    if (dist2(b.x, b.y, p.x, p.y) < rr * rr) {
      b.dead = true;
      FX.burst(b.x, b.y, 6, [b.color, '#ffffff'], 1.9, 12);
      damagePlayer(b.dmg);
    }
  }
  Game.eBullets = Game.eBullets.filter(b => !b.dead);
}

function updateSecretWaves() {
  const run = Game.inSecret;
  const def = SECRET_ROOMS[run.kind];
  run.timer++;
  if (run.kind === 'winston' && run.timer % 190 === 0) winstonBark('room');
  if (Game.spawnQueue.length) {
    if (--Game.spawnTimer <= 0) {
      const type = Game.spawnQueue.pop();
      const pt = findSpawnPoint(82);
      spawnEnemy(type, pt.x, pt.y);
      FX.burst(pt.x, pt.y, 8, ['#ffffff', def.accent], 1.6, 14);
      Game.spawnTimer = randInt(7, 16);
    }
    return;
  }
  if (Game.enemies.length) return;
  if (Game.waveGap > 0) { Game.waveGap--; return; }
  if (run.wave < def.waves.length - 1) {
    run.wave++;
    Game.waveGap = 50;
    setHint('SIDE ROOM WAVE ' + (run.wave + 1) + ' OF ' + def.waves.length, 100);
    if (def.banter && def.banter[run.wave - 1]) queueBanter(def.banter[run.wave - 1]);
    queueWave(def.waves[run.wave]);
    return;
  }
  completeSecretRoom();
}

function updateWaves() {
  if (puppyRescueBusy()) return;
  if (Game.inSecret) { updateSecretWaves(); return; }
  const L = LEVELS[Game.level];

  if (Game.spawnQueue.length) {
    if (--Game.spawnTimer <= 0) {
      const type = Game.spawnQueue.pop();
      const pt = findSpawnPoint(96);
      spawnEnemy(type, pt.x, pt.y);
      FX.burst(pt.x, pt.y, 8, ['#ffffff', '#b48ce0'], 1.6, 14);
      Game.spawnTimer = randInt(7, 18);
    }
    return;
  }

  if (Game.enemies.length) return;

  if (Game.waveGap > 0) { Game.waveGap--; return; }

  if (Game.waveIndex < L.waves.length - 1) {
    Game.waveIndex++;
    Game.waveGap = 70;
    if (Game.level === PUPPY_RESCUE.floor && Game.waveIndex === PUPPY_RESCUE.wave && startPuppyRescue()) return;
    const calls = FLOOR_CALLOUTS[Game.level];
    setHint(calls ? pick(calls) : 'WAVE ' + (Game.waveIndex + 1) + ' OF ' + L.waves.length, 100);
    const scripted = FLOOR_WAVE_BARKS[Game.level] && FLOOR_WAVE_BARKS[Game.level][Game.waveIndex - 1];
    if (scripted) {
      queueBanter(scripted);
    } else if (Math.random() < 0.32 || (Game.cModifier && Game.cModifier.id === 'catty')) {
      winstonBark('wave');
    }
    queueWave(L.waves[Game.waveIndex]);
    return;
  }

  if (L.boss && !Game.bossSpawned) {
    Game.bossSpawned = true;
    const bx = clamp(Game.player.x + rand(-40, 40), 70, Game.arenaW - 70);
    const by = clamp(Game.player.y - 130, 60, Game.arenaH - 60);
    const b = spawnEnemy(L.boss, bx, by);
    b.spawnIn = 40;
    Game.boss = b;
    FX.addShake(7); FX.addFlash(0.34);
    FX.burst(bx, by, 60, ['#ffffff'], 3.4, 34);
    setHint(L.boss === 'cait' ? 'CAIT, THE UNHINGED' : L.boss === 'werder' ? 'WERDERDLEY, THE AUX BATTLE' : L.boss === 'harold' ? 'HAROLD, THE FACEIT TEN' : 'MUSTIE, THE GRAND GOONER', 150);
    Snd.startMusic(L.scale, true, L.boss === 'cait' ? 'island' : L.boss === 'werder' ? 'werder' : L.boss === 'harold' ? 'harold' : L.boss === 'mustie' ? 'turkish' : null);
    Snd.explode();
    return;
  }

  levelComplete();
}

/* -- 12. STATE MACHINE ----------------------------------------------------- */

function setState(s) { Game.state = s; }

function startStory(beats, onDone) {
  Game.story = beats.filter(beat => !beat.requiresBracken || (Game.puppy?.found && !Game.puppy.retired));
  Game.storyIndex = 0;
  Game.storyChars = 0;
  Game.storyNext = onDone;
  Game.state = 'STORY';
  if (!Game.story.length) finishStory();
  else if (Game.story[0].s === 'bracken') Snd.woof();
}

function updateStory() {
  const beats = Game.story;
  const b = beats[Game.storyIndex];
  const full = b.t.length;
  if (Game.storyChars < full) Game.storyChars = Math.min(full, Game.storyChars + 0.85);

  const advance = Input.hit('Space', 'Enter', 'NumpadEnter', 'KeyE') || Input.downEdge;
  if (Input.hit('Escape')) { finishStory(); return; }
  if (advance) {
    if (Game.storyChars < full) { Game.storyChars = full; return; }
    Snd.select();
    Game.storyIndex++;
    Game.storyChars = 0;
    if (Game.storyIndex >= beats.length) finishStory();
    else if (beats[Game.storyIndex].s === 'bracken') Snd.woof();
  }
}

function finishStory() {
  const next = Game.storyNext;
  Game.story = null;
  Game.storyNext = null;
  if (next) next();
}

function levelComplete() {
  Snd.stopMusic();
  if (Game.cModifier && Game.cModifier.id === 'clutch' && Game.player.hp / Game.player.maxHp < 0.35) unlockAchievement('clutch');
  Game.bestLevel = Math.max(Game.bestLevel, Game.level + 1);
  save('bestLevel', Game.bestLevel);

  if (Game.level >= LEVELS.length - 1) {
    startStory(STORY.victory, () => {
      Game.state = 'VICTORY';
      Game.endTimer = 0;
      if (Game.best === null || Game.runTime < Game.best) { Game.best = Game.runTime; save('best', Game.best); }
      Game.totalKills += Game.kills;
      save('totalKills', Game.totalKills);
      Net.submitRun();
    });
    return;
  }

  const outKey = 'l' + (Game.level + 1) + '_out';
  const go = () => startUpgrade();
  if (STORY[outKey]) startStory(STORY[outKey], go); else go();
}

function startUpgrade() {
  const p = Game.player;
  const pool = UPGRADES.filter(u => !(u.once && p.taken.indexOf(u.id) >= 0));
  const picks = [];
  const copy = pool.slice();
  for (let i = 0; i < 3 && copy.length; i++) picks.push(copy.splice(randInt(0, copy.length - 1), 1)[0]);
  Game.upgradeChoices = picks;
  Game.upgradeIndex = 0;
  Game.state = 'UPGRADE';
}

function chooseUpgrade(i) {
  const u = Game.upgradeChoices[i];
  if (!u) return;
  u.apply(Game.player);
  Game.player.taken.push(u.id);
  Snd.pickup();
  const nl = Game.level + 1;
  const inKey = 'l' + (nl + 1) + '_in';
  const go = () => { startLevel(nl); setState('PLAY'); };
  if (STORY[inKey]) startStory(STORY[inKey], go); else go();
}

function updateUpgrade() {
  const n = Game.upgradeChoices.length;
  if (Input.hit('ArrowLeft', 'KeyA')) { Game.upgradeIndex = (Game.upgradeIndex + n - 1) % n; Snd.select(); }
  if (Input.hit('ArrowRight', 'KeyD')) { Game.upgradeIndex = (Game.upgradeIndex + 1) % n; Snd.select(); }
  for (let i = 0; i < n; i++) if (Input.hit('Digit' + (i + 1))) { chooseUpgrade(i); return; }
  if (Input.hit('Space', 'Enter', 'NumpadEnter')) { chooseUpgrade(Game.upgradeIndex); return; }
  if (Input.downEdge) {
    // click a card directly
    for (let i = 0; i < n; i++) {
      const x = VW / 2 + (i - (n - 1) / 2) * 132;
      if (Input.mx > x - 62 && Input.mx < x + 62 && Input.my > 92 && Input.my < 200) { chooseUpgrade(i); return; }
    }
  }
}

function newRun() {
  resetPuppy();
  Game.cModifier = pick(C_MODIFIERS);
  Game.player = makePlayer();
  applyCModifier(Game.player);
  Game.score = 0;
  Game.kills = 0;
  Game.runTime = 0;
  Game.levelStartScore = 0;
  Game.levelStartKills = 0;
  Game.levelStartAmmo = Game.player.ammo.slice();
  Game.party = ['jayc'];
  Game.rescueProgress = 0;
  Game.teamBuff = 0;
  Game.bailTimer = 0;
  Game.lastBailLevel = -1;
  Game.cameosSeen = [];
  Game.oneClipBuff = 0; Game.grassBuff = 0; Game.silenceBuff = 0; Game.obamaT = 0;
  Game.secretVisited = [];
  Game.inSecret = null;
  Game.secretReturn = null;
  Game.secretPortal = null;
  clearBarks();
  Game.ungoonTags.length = 0;
  Game.ungoonBags = {};
  Game.shockwave = null;
  FX.clear();
  startStory(STORY.intro, () => { startLevel(0); setState('PLAY'); });
}

function retryLevel() {
  const p = Game.player;
  Game.score = Game.levelStartScore;
  Game.kills = Game.levelStartKills;
  p.ammo = Game.levelStartAmmo.slice();
  p.hp = p.maxHp;
  p.invuln = 70;
  p.clarity = 0;
  p.dashCharges = p.dashMax;
  Game.shockwave = null;
  startLevel(Game.level);
  setState('PLAY');
}

/* -- 13. RENDER ------------------------------------------------------------
   Camera, shake and every draw position are floored to whole pixels. Nothing
   in here is allowed to land on a half-pixel.                              */

let VIGNETTE = null;

function bakeVignette() {
  const c = makeCanvas(VW, VH);
  const g = c.getContext('2d');
  const img = g.createImageData(VW, VH);
  const d = img.data;
  const cx = VW / 2, cy = VH / 2, maxD = Math.hypot(cx, cy);
  for (let y = 0; y < VH; y++) {
    for (let x = 0; x < VW; x++) {
      const t = Math.hypot(x - cx, y - cy) / maxD;
      let a = clamp((t - 0.55) / 0.45, 0, 1);
      a = a * a * 190;
      // ordered dither so the falloff stays chunky instead of smooth
      if (((x + y) & 1) === 0) a *= 0.72;
      const i = (y * VW + x) * 4;
      d[i] = 4; d[i + 1] = 3; d[i + 2] = 10; d[i + 3] = a;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

function updateCamera() {
  const p = Game.player;
  if (puppyRescueBusy()) {
    if (Game.state !== 'PLAY') return;
    const scene = Game.puppyRescue, dog = Game.puppy;
    const focus = scene.phase === 'reveal' || scene.phase === 'charge' ? dog : p;
    const tx = clamp(focus.x - VW / 2, 0, Math.max(0, Game.arenaW - VW));
    const ty = clamp(focus.y - VH / 2, 0, Math.max(0, Game.arenaH - VH));
    if (scene.phase === 'reveal' || scene.phase === 'greeting') {
      const progress = clamp(scene.t / PUPPY_RESCUE.panTime, 0, 1);
      const ease = progress * progress * (3 - 2 * progress);
      Game.cam.x = lerp(scene.cameraFrom.x, tx, ease);
      Game.cam.y = lerp(scene.cameraFrom.y, ty, ease);
    } else {
      // Ignore mouse look-ahead during the scene and follow the charge smoothly.
      Game.cam.x = lerp(Game.cam.x, tx, 0.06);
      Game.cam.y = lerp(Game.cam.y, ty, 0.06);
    }
    return;
  }
  const m = mouseWorld();
  const lookX = clamp((m.x - p.x) * 0.16, -46, 46);
  const lookY = clamp((m.y - p.y) * 0.16, -32, 32);
  const tx = clamp(p.x + lookX - VW / 2, 0, Math.max(0, Game.arenaW - VW));
  const ty = clamp(p.y + lookY - VH / 2, 0, Math.max(0, Game.arenaH - VH));
  Game.cam.x = lerp(Game.cam.x, tx, 0.11);
  Game.cam.y = lerp(Game.cam.y, ty, 0.11);
}

// A squat shadow under every entity. Costs two rects and does more for
// readability than any amount of extra sprite detail.
function groundShadow(g, x, y, w) {
  g.fillStyle = 'rgba(6,4,12,0.42)';
  const hw = w >> 1;
  g.fillRect(x - hw, y, w, 2);
  g.fillRect(x - hw + 2, y - 1, w - 4, 4);
}

function drawSet(g, set, cx, cy, flash, flip) {
  const c = flash ? (flip ? set.fL : set.f) : (flip ? set.nL : set.n);
  g.drawImage(c, Math.floor(cx - c.width / 2), Math.floor(cy - c.height / 2));
}

function drawPlayerSprite(g, camX, camY) {
  const p = Game.player;
  if (!puppyRescueBusy() && p.invuln > 0 && p.hurtFlash <= 0 && Math.floor(Game.frames / 3) % 2 === 0 && p.dashT <= 0) return;
  const set = SPR.jayc[p.facing][p.legs];
  const x = Math.floor(p.x - camX);
  const y = Math.floor(p.y - camY) + p.bob;
  const c = (p.hurtFlash > 0) ? (p.flip ? set.fL : set.f) : (p.flip ? set.nL : set.n);
  groundShadow(g, x, y + 9, 14);
  // sprite is 24 tall; row 14 is the torso, which is where p.y lives
  g.drawImage(c, x - 12, y - 14);
  drawGun(g, x, y, p.aim);
}

// The gun is drawn procedurally along the aim vector so it can point anywhere
// without rotating (and smearing) a baked sprite.
function drawGun(g, x, y, aim) {
  const p = Game.player;
  const W = WEAPONS[p.weapon];
  const ca = Math.cos(aim), sa = Math.sin(aim);
  const hx = x + Math.round(ca * 6), hy = y + Math.round(sa * 6) + 1;
  g.fillStyle = '#171a26';
  for (let i = 0; i < 6; i++) {
    g.fillRect(Math.round(hx + ca * i), Math.round(hy + sa * i), 2, 2);
  }
  g.fillStyle = W.color;
  g.fillRect(Math.round(hx + ca * 6), Math.round(hy + sa * 6), 2, 2);
  if (p.fireCd > Math.max(2, Math.round(W.rof * p.rofMul)) - 3) {
    g.fillStyle = '#ffffff';
    g.fillRect(Math.round(hx + ca * 8) - 1, Math.round(hy + sa * 8) - 1, 3, 3);
  }
}

function drawBoss(g, e, camX, camY) {
  const x = Math.floor(e.x - camX), y = Math.floor(e.y - camY);
  const pal = ENEMY_PALS[e.sprite];

  // final-boss sweeping beam
  if (e.laser > 0) {
    const ca = Math.cos(e.laserA), sa = Math.sin(e.laserA);
    for (let d = 24; d < 460; d += 3) {
      const px = Math.floor(x + ca * d), py = Math.floor(y + sa * d);
      if (px < -8 || py < -8 || px > VW + 8 || py > VH + 8) break;
      g.fillStyle = (d % 12 < 6) ? '#ffe9a8' : '#f5c542';
      g.fillRect(px, py, 3, 3);
    }
  }

  // orbiting screen shards: makes the boss read far bigger than its grid
  const shards = e.type === 'mustie' ? 6 : 4;
  const orbit = (e.type === 'mustie' ? 34 : 26) + Math.sin(e.anim * 0.03) * 3;
  for (let i = 0; i < shards; i++) {
    const a = e.anim * 0.021 + (i / shards) * TAU;
    const sx = Math.floor(x + Math.cos(a) * orbit);
    const sy = Math.floor(y + Math.sin(a) * orbit * 0.7);
    g.fillStyle = pal.o;
    g.fillRect(sx - 4, sy - 5, 8, 10);
    g.fillStyle = e.flash > 0 ? '#ffffff' : (pal.sh || pal.k || pal.c || pal.g || '#ffffff');
    g.fillRect(sx - 3, sy - 4, 6, 8);
    g.fillStyle = e.flash > 0 ? '#ffffff' : (pal.l || '#ffffff');
    g.fillRect(sx - 2, sy - 3, 4, 2);
  }

  // charge telegraph
  if (e.charge > 26) {
    const ca = Math.cos(e.chargeA), sa = Math.sin(e.chargeA);
    for (let d = 30; d < 150; d += 8) {
      g.fillStyle = Math.floor(Game.frames / 3) % 2 ? '#ffe9a8' : '#e30a17';
      g.fillRect(Math.floor(x + ca * d), Math.floor(y + sa * d), 2, 2);
    }
  }

  groundShadow(g, x, y + (e.h >> 1) - 3, e.w - 8);
  drawSet(g, SPR.enemy[e.sprite], x, y, e.flash > 0, e.flip);
  if (e.type === 'harold') {
    g.save();
    g.translate(x, y + 7);
    g.rotate(e.aim || 0);
    g.fillStyle = '#201712'; g.fillRect(4, -3, 18, 4);           // receiver + barrel
    g.fillStyle = '#6f4227'; g.fillRect(1, -4, 8, 6);            // wood handguard
    g.fillRect(-4, -2, 7, 5); g.fillRect(9, 1, 5, 7);            // stock + curved mag
    g.fillStyle = '#0b0b0d'; g.fillRect(20, -2, 7, 2);
    if (e.akFlash > 0) {
      g.fillStyle = '#fff0a8'; g.fillRect(27, -4, 5, 6);
      g.fillStyle = '#f28a2e'; g.fillRect(30, -2, 5, 2);
    }
    g.restore();
  }
}

function renderWorld(g) {
  const sh = FX.shakeOffset();
  const camX = Math.floor(Game.cam.x) + sh.x;
  const camY = Math.floor(Game.cam.y) + sh.y;
  const L = Game.inSecret ? SECRET_ROOMS[Game.inSecret.kind] : LEVELS[Game.level];

  g.fillStyle = '#05050a';
  g.fillRect(0, 0, VW, VH);
  if (Game.bg) g.drawImage(Game.bg, -camX, -camY);
  if (!Game.inSecret && Game.level === 3) renderAuxEqualizer(g, camX, camY);
  if (!Game.inSecret && Game.level === 4) renderQuoteWalls(g, camX, camY);

  // Optional side-room doors flicker at the edge of two arenas. They never
  // block progression; walking close explains the interaction.
  if (Game.secretPortal) {
    const po = Game.secretPortal;
    const px = Math.floor(po.x - camX), py = Math.floor(po.y - camY);
    const col = po.kind === 'winston' ? '#ff6bd0' : po.kind === 'connor' ? '#ff536f' : '#7db0ff';
    g.fillStyle = '#05050a'; g.fillRect(px - 10, py - 14, 20, 28);
    g.fillStyle = col;
    g.fillRect(px - 9, py - 13, 18, 2); g.fillRect(px - 9, py + 11, 18, 2);
    g.fillRect(px - 9, py - 13, 2, 26); g.fillRect(px + 7, py - 13, 2, 26);
    if (Math.floor(Game.frames / 8) % 2 === 0) g.fillRect(px - 4, py - 5, 8, 10);
  }

  // pickups sit under everything else
  for (const pk of Game.pickups) {
    const bobY = Math.round(Math.sin(Game.frames * 0.09 + pk.bob) * 1.5);
    const px = Math.floor(pk.x - camX), py = Math.floor(pk.y - camY) + bobY;
    if (pk.life < 180 && Math.floor(pk.life / 6) % 2 === 0) continue;
    const spr = pk.kind === 'health' ? SPR.heart : pk.kind === 'ammo' ? SPR.ammo : SPR.crate;
    g.drawImage(spr, px - (spr.width >> 1), py - (spr.height >> 1));
    if (pk.kind === 'quote') drawText(g, '?', px, py - 3, '#ff9de0', 'center');
  }

  for (const o of Game.obstacles) if (o.kind !== 'petCouch') drawObstacle(g, o, L, camX, camY);
  renderFinalPetCouch(g, camX, camY);

  // depth sort so things lower on screen overlap things above them
  const drawables = [];
  for (const e of Game.enemies) drawables.push(e);
  drawables.push(Game.player);
  drawables.sort((a, b) => a.y - b.y);

  for (const d of drawables) {
    if (d === Game.player) { drawPlayerSprite(g, camX, camY); continue; }
    if (d.spawnIn > 0) {
      // spawn tell: a blinking marker before the enemy actually exists
      if (Math.floor(d.spawnIn / 3) % 2 === 0) {
        g.fillStyle = '#b48ce0';
        g.fillRect(Math.floor(d.x - camX) - 3, Math.floor(d.y - camY) - 3, 6, 6);
      }
      continue;
    }
    if (d.boss) { drawBoss(g, d, camX, camY); continue; }
    groundShadow(g, Math.floor(d.x - camX), Math.floor(d.y - camY) + (d.h >> 1) - 2, d.w - 6);
    const enemyY = Math.floor(d.y - camY) - (d.type === 'froggy' ? Math.floor(Math.abs(Math.sin(d.anim * 0.10)) * 4) : 0);
    if (d.fuse >= 0 && Math.floor(d.fuse / 3) % 2 === 0) {
      drawSet(g, enemySpriteSet(d), Math.floor(d.x - camX), enemyY, true, d.flip);
    } else {
      drawSet(g, enemySpriteSet(d), Math.floor(d.x - camX), enemyY, d.flash > 0, d.flip);
    }
    if (d.sodaMob) {
      const sx = Math.floor(d.x - camX), sy = Math.floor(d.y - camY);
      g.fillStyle = '#e9eff8'; g.fillRect(sx - 3, sy - 5, 6, 10);
      g.fillStyle = '#e0504f'; g.fillRect(sx - 3, sy - 2, 6, 5);
      g.fillStyle = '#77869b'; g.fillRect(sx - 2, sy - 6, 4, 1);
    }
  }

  renderPuppy(g, camX, camY);
  renderFinalPetCat(g, camX, camY);
  renderFinalPetGreeting(g, camX, camY);

  // bullets
  for (const b of Game.bullets) {
    const bx = Math.floor(b.x - camX), by = Math.floor(b.y - camY);
    g.fillStyle = b.color;
    const s = b.pierce ? 3 : 2;
    g.fillRect(bx - (s >> 1), by - (s >> 1), s, s);
  }
  for (const b of Game.eBullets) {
    const bx = Math.floor(b.x - camX), by = Math.floor(b.y - camY);
    if (b.flower) {
      g.save();
      g.translate(bx, by);
      g.rotate(Math.atan2(b.vy, b.vx));
      g.fillStyle = '#3f8f43'; g.fillRect(-6, 0, 5, 1); g.fillRect(-5, 1, 2, 2);
      g.fillStyle = b.color;
      g.fillRect(-2, -4, 4, 3); g.fillRect(-2, 2, 4, 3);
      g.fillRect(-5, -2, 3, 4); g.fillRect(2, -2, 3, 4);
      g.fillStyle = '#ffe94a'; g.fillRect(-2, -2, 4, 4);
      g.restore();
    } else if (b.seaBass) {
      g.save();
      g.translate(bx, by);
      g.rotate(Math.atan2(b.vy, b.vx));
      g.fillStyle = '#164b68'; g.fillRect(-5, -2, 8, 5);
      g.fillStyle = '#7ad8ff'; g.fillRect(-4, -1, 7, 3);
      g.fillStyle = '#d8f6ff'; g.fillRect(1, -1, 1, 1);
      g.fillStyle = '#164b68'; g.fillRect(3, 0, 3, 1); g.fillRect(-7, -3, 3, 2); g.fillRect(-7, 2, 3, 2);
      g.restore();
    } else if (b.kilij) {
      g.save();
      g.translate(bx, by);
      g.rotate(Math.atan2(b.vy, b.vx));
      g.fillStyle = '#3a2717'; g.fillRect(-6, -1, 3, 2);     // grip
      g.fillStyle = '#c8971f'; g.fillRect(-3, -2, 1, 4);     // guard
      g.fillStyle = '#f5c542'; g.fillRect(-2, -1, 7, 2);     // blade
      g.fillRect(5, -3, 2, 2);                               // curved tip
      g.fillStyle = '#fff7cc'; g.fillRect(0, -1, 3, 1);      // shine
      g.restore();
    } else if (b.ak) {
      g.save();
      g.translate(bx, by);
      g.rotate(Math.atan2(b.vy, b.vx));
      g.fillStyle = '#fff0a8'; g.fillRect(-4, -1, 7, 2);
      g.fillStyle = '#f28a2e'; g.fillRect(1, 0, 5, 1);
      g.fillStyle = '#7b3d22'; g.fillRect(-6, 0, 2, 1);
      g.restore();
    } else if (b.vinyl) {
      g.save();
      g.translate(bx, by);
      g.rotate(Game.frames * 0.22);
      g.fillStyle = '#09080d'; g.fillRect(-5, -3, 10, 7); g.fillRect(-3, -5, 7, 10);
      g.fillStyle = '#5f82ff'; g.fillRect(-3, -3, 6, 6);
      g.fillStyle = '#f5c542'; g.fillRect(-1, -1, 2, 2);
      g.restore();
    } else {
      g.fillStyle = '#ffffff';
      g.fillRect(bx - 1, by - 1, 3, 3);
      g.fillStyle = b.color;
      g.fillRect(bx - 1, by, 3, 1);
      g.fillRect(bx, by - 1, 1, 3);
    }
  }

  // particles
  for (const p of FX.parts) {
    g.fillStyle = p.color;
    const s = p.life > p.maxLife * 0.6 ? (p.size + 1) : p.size;
    g.fillRect(Math.floor(p.x - camX), Math.floor(p.y - camY), s, s);
  }

  // clarity shockwave ring
  if (Game.shockwave) {
    const s = Game.shockwave;
    const p = Game.player;
    const cx = Math.floor(p.x - camX), cy = Math.floor(p.y - camY);
    g.fillStyle = s.life > 13 ? '#ffffff' : '#9df3ff';
    const steps = Math.max(24, Math.floor(s.r));
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * TAU;
      g.fillRect(Math.floor(cx + Math.cos(a) * s.r), Math.floor(cy + Math.sin(a) * s.r), 2, 2);
    }
  }

  if (Game.silenceBuff > 0) {
    const p = Game.player, cx = Math.floor(p.x - camX), cy = Math.floor(p.y - camY);
    g.fillStyle = Math.floor(Game.frames / 4) % 2 ? '#ff536f' : '#7e2639';
    for (let i = 0; i < 42; i++) {
      const a = i / 42 * TAU;
      g.fillRect(Math.floor(cx + Math.cos(a) * 58), Math.floor(cy + Math.sin(a) * 58), 2, 2);
    }
  }

  // damage numbers
  for (const n of FX.numbers) {
    const a = n.life > 8 ? 1 : n.life / 8;
    if (a < 0.5 && Math.floor(Game.frames / 2) % 2 === 0) continue;
    drawText(g, n.text, Math.floor(n.x - camX), Math.floor(n.y - camY), n.color, 'center');
  }

  for (const t of Game.ungoonTags) {
    if (t.life <= 0) continue;
    const blink = t.life < 14 && Math.floor(t.life / 2) % 2 === 0;
    if (!blink) {
      drawText(g, t.name + ' UN-GOONED', Math.floor(t.x - camX), Math.floor(t.y - camY - (64 - t.life) * 0.18), t.color, 'center');
      if (t.life > 34) drawText(g, t.line, Math.floor(t.x - camX), Math.floor(t.y - camY + 9), '#e9eff8', 'center');
    }
  }
}

/* -- HUD ------------------------------------------------------------------- */

function bar(g, x, y, w, h, frac, fg, bg) {
  g.fillStyle = '#0a0810'; g.fillRect(x - 1, y - 1, w + 2, h + 2);
  g.fillStyle = bg; g.fillRect(x, y, w, h);
  g.fillStyle = fg; g.fillRect(x, y, Math.round(w * clamp(frac, 0, 1)), h);
}

function renderObamaCameo(g) {
  if (Game.obamaT <= 0) return;
  panel(g, 326, 172, 148, 56, 'rgba(8,10,18,0.94)', '#6ba0d8');
  const x = 346, y = 189;
  g.fillStyle = '#201813'; g.fillRect(x - 8, y - 10, 16, 5);
  g.fillStyle = '#9a6547'; g.fillRect(x - 7, y - 6, 14, 15);
  g.fillStyle = '#211814'; g.fillRect(x - 4, y, 2, 2); g.fillRect(x + 3, y, 2, 2);
  g.fillRect(x - 3, y + 6, 7, 1);
  g.fillStyle = '#253a68'; g.fillRect(x - 9, y + 10, 18, 12);
  drawText(g, 'OBAMA CAMEO', 365, 179, '#9dc9ff');
  drawText(g, 'PLAYS CAIT', 365, 191, '#e9eff8');

}

function renderHUD(g) {
  const p = Game.player;
  const L = Game.inSecret ? SECRET_ROOMS[Game.inSecret.kind] : LEVELS[Game.level];

  // health
  g.drawImage(SPR.heart, 5, 5);
  bar(g, 16, 7, 74, 5, p.hp / p.maxHp, p.hp / p.maxHp < 0.3 ? '#ff4a5e' : '#4ade80', '#331a22');
  drawText(g, Math.ceil(p.hp) + '/' + p.maxHp, 94, 4, '#8f8fae');

  // clarity
  drawText(g, 'CLARITY', 5, 16, '#5c6b8a');
  bar(g, 48, 17, 42, 4, p.clarity / p.clarityMax, p.clarity >= p.clarityMax ? '#ffffff' : '#4fb8e8', '#1b2430');
  if (p.clarity >= p.clarityMax && Math.floor(Game.frames / 12) % 2 === 0) drawText(g, 'Q', 94, 15, '#9df3ff');

  // dash pips
  for (let i = 0; i < p.dashMax; i++) {
    const ready = i < p.dashCharges;
    g.fillStyle = ready ? '#9df3ff' : '#2b3348';
    g.fillRect(5 + i * 7, 26, 5, 3);
  }

  // The server's real objective: answer the ping and get five.
  drawText(g, 'PING ' + Game.party.length + '/5', 5, 34, Game.party.length >= 5 ? '#4ade80' : '#ff9de0');
  for (let i = 0; i < 5; i++) {
    g.fillStyle = i < Game.party.length ? (Game.teamBuff > 0 ? '#ffffff' : '#9df3ff') : '#2b3348';
    g.fillRect(5 + i * 8, 44, 6, 3);
  }
  if (Game.teamBuff > 0) drawText(g, 'WE HAVE 5', 48, 40, '#4ade80');

  if (Game.puppy && Game.puppy.found && puppyVisible() && !puppyRescueBusy()) {
    const dog = Game.puppy;
    const status = dog.retired ? 'OFF DUTY' : dog.active > 0 ? 'HELPING ' + Math.ceil(dog.active / 60) + 'S' :
      dog.cooldown > 0 ? 'REST ' + Math.ceil(dog.cooldown / 60) + 'S' : 'READY';
    drawText(g, 'BRACKEN ' + status, VW - 5, VH - 40, '#f3cd91', 'right');
  }

  // weapon + ammo
  const W = WEAPONS[p.weapon];
  drawText(g, W.name, 5, VH - 12, W.color);
  const ammo = p.ammo[p.weapon];
  drawText(g, ammo === Infinity ? 'INF' : ammo, 5, VH - 22, ammo !== Infinity && ammo < 10 ? '#ff4a5e' : '#8f8fae');

  // owned weapon slots
  let sx = 5 + textWidth(W.name, 0) + 12;
  for (let i = 0; i < 4; i++) {
    if (!p.unlocked[i]) continue;
    g.fillStyle = i === p.weapon ? WEAPONS[i].color : '#2b3348';
    g.fillRect(sx, VH - 12, 6, 7);
    drawText(g, String(i + 1), sx, VH - 12, i === p.weapon ? '#0a0810' : '#5c6b8a');
    sx += 9;
  }

  // score / level
  drawText(g, 'SCORE ' + Game.score, VW - 5, 5, '#e9eff8', 'right');
  drawText(g, Game.inSecret ? 'SECRET ROOM' : L.name, VW - 5, 14, '#5c6b8a', 'right');
  const waveTxt = Game.inSecret ? 'SIDE ROOM ' + (Game.inSecret.wave + 1) + '/' + L.waves.length : Game.bossSpawned ? 'BOSS' : 'WAVE ' + (Game.waveIndex + 1) + '/' + L.waves.length;
  drawText(g, waveTxt, VW - 5, 23, '#8f8fae', 'right');

  // boss bar
  if (Game.boss && !Game.boss.dead) {
    const b = Game.boss;
    const bt = b.type;

    Game.hintTimer--;

    if (a > 0.4 || Math.floor(Game.frames / 3) % 2 === 0) {
      drawText(g, Game.hint, VW / 2, 40, '#e9eff8', 'center');
    }
  }

  const rescueLine = puppyRescueBusy() ? PUPPY_RESCUE.lines[Game.puppyRescue.phase] : null;
  const bark = rescueLine ? { speaker: rescueLine.s, text: rescueLine.t } : Game.barkTimer > 0 ? Game.bark : null;
  if (bark) {
    const lines = wrapText(bark.text, 260, 0);
    const h = 24 + Math.min(2, lines.length) * 10;
    const y = Game.inSecret ? 53 : VH - h - 31;
    const barkColor = bark.bail ? '#ff536f' : bark.speaker === 'PRIDE WINSTON' ? '#ff6bd0' : '#9df3ff';
    panel(g, 5, y, 280, h, 'rgba(10,8,16,0.92)', barkColor);
    drawText(g, bark.speaker, 13, y + 6, barkColor);
    for (let i = 0; i < lines.length && i < 2; i++) drawText(g, lines[i], 13, y + 17 + i * 10, '#e9eff8');
  }

  renderObamaCameo(g);

  if (Game.achievementToast && Game.achievementTimer > 0 && !puppyRescueBusy()) {
    const ax = VW - 190, ay = VH - 48;
    panel(g, ax, ay, 185, 31, 'rgba(10,8,16,0.94)', '#f5c542');
    drawText(g, 'ACHIEVEMENT UNLOCKED', ax + 92, ay + 6, '#f5c542', 'center');
    drawText(g, Game.achievementToast.name, ax + 92, ay + 17, '#ffffff', 'center');
  }

  // low health warning
  if (p.hp / p.maxHp < 0.3 && p.hp > 0) {
    const pulse = (Math.sin(Game.frames * 0.16) * 0.5 + 0.5) * 0.30 + 0.06;
    g.save();
    g.globalAlpha = pulse;
    g.fillStyle = '#c8324a';
    g.fillRect(0, 0, VW, 3); g.fillRect(0, VH - 3, VW, 3);
    g.fillRect(0, 0, 3, VH); g.fillRect(VW - 3, 0, 3, VH);
    g.restore();
  }
}

// Integer-scaled text. drawImage on a smoothing-disabled context keeps the
// glyphs nearest-neighbour crisp instead of blurring them up.
function drawTextBig(g, str, x, y, color, align, scale) {
  str = String(str).toUpperCase();
  const w = str.length * CELL_W * scale;
  let px = Math.floor(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  const py = Math.floor(y);
  const atlas = fontAtlas(color);
  for (let i = 0; i < str.length; i++) {
    const gi = GLYPH_INDEX[str[i]];
    if (gi !== undefined && str[i] !== ' ') {
      g.drawImage(atlas, gi * CELL_W, 0, CELL_W, CELL_H, px, py, CELL_W * scale, CELL_H * scale);
    }
    px += CELL_W * scale;
  }
}

/* -- LEADERBOARD ----------------------------------------------------------
   Only active when the game is served over http(s) from a host that provides
   /api/jayc/*. Opened straight from the filesystem the whole module stays
   dormant and the game plays exactly as it always has, offline.

   Identity comes from the host's Steam sign-in: the session cookie rides along
   on a same-origin fetch, so the game never sees or handles a credential. */
const Net = {
  enabled: location.protocol === 'http:' || location.protocol === 'https:',
  state: 'idle',       // idle | loading | ready | error
  me: null,            // { name, rank, runFrames, runs } once signed in
  top: [],
  error: '',
  submitState: 'none', // none | sending | saved | failed | anon
  submitNote: '',

  loginUrl() { return '/api/auth/steam?to=jayc'; },

  // Pulls the board and the caller's identity in one request.
  refresh() {
    if (!this.enabled || this.state === 'loading') return;
    this.state = 'loading';
    fetch('/api/jayc/leaderboard?limit=20', { credentials: 'same-origin' })
      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then((data) => {
        this.me = data.me || null;
        this.top = Array.isArray(data.top) ? data.top : [];
        this.state = 'ready';
      })
      .catch((e) => { this.state = 'error'; this.error = String(e.message || e); });
  },

  // Called once on a full clear. A signed-out player still sees their local
  // best; they are told how to get on the board rather than losing the run.
  submitRun() {
    if (!this.enabled) return;
    if (!this.me) { this.submitState = 'anon'; return; }
    this.submitState = 'sending';
    this.submitNote = '';
    fetch('/api/jayc/score', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        runFrames: Game.runTime,
        kills: Game.kills,
        score: Game.score,
        modifier: Game.cModifier ? Game.cModifier.id : 'none',
        quotes: Game.discoveredQuotes.length,
        achievements: Game.achievements.length
      })
    })
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then((res) => {
        if (!res.ok) throw new Error(res.body && res.body.error ? res.body.error : 'rejected');
        this.submitState = 'saved';
        this.submitNote = res.body.improved ? 'NEW BEST ON THE BOARD' : 'BOARD TIME UNCHANGED';
        this.state = 'idle';        // force a refetch next time the board opens
      })
      .catch((e) => { this.submitState = 'failed'; this.submitNote = String(e.message || e).toUpperCase(); });
  }
};

function fmtTime(frames) {
  const s = Math.floor(frames / 60);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function panel(g, x, y, w, h, fill, border) {
  g.fillStyle = '#05050a';
  g.fillRect(x + 2, y + 3, w, h);
  g.fillStyle = fill || '#12101c';
  g.fillRect(x, y, w, h);
  g.fillStyle = border || '#3b425e';
  g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1);
  g.fillRect(x, y, 1, h); g.fillRect(x + w - 1, y, 1, h);
}

function starfield(g) {
  // cheap animated backdrop for the menus: a drifting dither field
  g.fillStyle = '#07070f';
  g.fillRect(0, 0, VW, VH);
  const t = Game.frames * 0.35;
  for (let i = 0; i < 70; i++) {
    const x = (i * 71 + t * (1 + (i % 3))) % VW;
    const y = (i * 43 + (i % 7) * 19) % VH;
    g.fillStyle = i % 5 === 0 ? '#2b3348' : '#171a26';
    g.fillRect(Math.floor(VW - x), Math.floor(y), 2, 2);
  }
}

    g.fillStyle = '#05050a';
    g.fillRect(34, boxY + 10, 28, 28);

    drawText(g, 'READING THE BOARD' + '.'.repeat(1 + Math.floor(Game.frames / 20) % 3), VW / 2, 120, '#8f8fae', 'center');

      // glyphs it has, and the width cap keeps a long name out of the columns.
      drawText(g, String(r.name).toUpperCase().slice(0, 18), 62, y, col);
      drawText(g, fmtTime(r.runFrames), 300, y, col);
      drawText(g, r.modifier === 'none' ? '-' : String(r.modifier).toUpperCase().slice(0, 6), 352, y, r.modifier === 'l' ? '#ff6b6b' : '#5c6b8a');

  }

  if (Game.endTimer > 50 && Math.floor(Game.frames / 22) % 2 === 0) {
    drawText(g, 'SPACE - PLAY AGAIN', VW / 2, 253, '#9df3ff', 'center');
  }
}

/* -- per-state update ------------------------------------------------------ */

function updateTitle() {
  if (Input.hit('KeyL')) { Snd.select(); Game.quotePage = 0; Game.state = 'QUOTES'; return; }
  if (Input.hit('KeyA')) { Snd.select(); Game.state = 'ACHIEVEMENTS'; return; }
  if (Net.enabled && Input.hit('KeyB')) { Snd.select(); Net.refresh(); Game.state = 'BOARD'; return; }
  if (Input.hit('Space', 'Enter', 'NumpadEnter') || Input.downEdge) { Snd.select(); newRun(); }
}

function updateQuoteLog() {
  const pages = Math.max(1, Math.ceil(QUOTE_BANK.length / 5));
  if (Input.hit('ArrowLeft', 'KeyA')) { Game.quotePage = (Game.quotePage + pages - 1) % pages; Snd.select(); }
  if (Input.hit('ArrowRight', 'KeyD')) { Game.quotePage = (Game.quotePage + 1) % pages; Snd.select(); }
  if (Input.hit('Escape', 'KeyL', 'Backspace')) { Snd.select(); Game.state = 'TITLE'; }
}

function updateAchievements() {
  if (Input.hit('Escape', 'KeyA', 'Backspace')) { Snd.select(); Game.state = 'TITLE'; }
}

function updateBoard() {
  if (Input.hit('Escape', 'KeyB', 'Backspace')) { Snd.select(); Game.state = 'TITLE'; return; }
  if (Input.hit('KeyR')) { Snd.select(); Net.state = 'idle'; Net.refresh(); return; }
  // Signing in leaves the game entirely, so only act on a deliberate press.
  if (!Net.me && Net.state === 'ready' && Input.hit('Enter', 'NumpadEnter')) {
    location.href = Net.loginUrl();
  }
}

function updatePlay() {
  if (Input.hit('Escape')) { Game.state = 'PAUSE'; return; }
  if (FX.hitstop > 0) { updateCamera(); return; }
  if (finalPetsBusy()) { updateFinalPets(); updateCamera(); return; }
  if (puppyRescueBusy()) {
    Game.runTime++; Game.levelTime++;
    updatePuppyRescue(); updateEnemies(); updateBullets(); updateCamera(); return;
  }
  Game.runTime++;
  Game.levelTime++;
  if (Game.teamBuff > 0) Game.teamBuff--;
  if (!Game.inSecret && Game.level >= 1 && Game.party.length === 5 && Game.lastBailLevel !== Game.level && !Game.bossSpawned) {
    if (Game.bailTimer > 0) Game.bailTimer--;
    else bailPartyMember();
  }
  if (Game.oneClipBuff > 0) Game.oneClipBuff--;
  if (Game.grassBuff > 0) Game.grassBuff--;
  if (Game.silenceBuff > 0) Game.silenceBuff--;
  if (!Game.inSecret && !Game.cameoTriggered && Game.levelTime >= 90) {
    Game.cameoTriggered = true;
    triggerCameo(CAMEOS.find(c => c.level === Game.level));
  }
  if (!Game.inSecret && Game.level === 0 && Game.levelTime === 210) setHint('UN-GOON MEMBERS. FILL THE PING. GET FIVE.', 180);
  if (Game.cModifier && Game.cModifier.id === 'catty' && Game.frames % 780 === 0) winstonBark('wave');
  updatePlayer();
  updatePuppy();
  updateEnemies();
  updateBullets();
  updateWaves();
  if (Game.shockwave) {
    Game.shockwave.r += 7;
    if (--Game.shockwave.life <= 0) Game.shockwave = null;
  }
  updateCamera();
}

function updatePause() {
  if (Input.hit('Escape')) { Game.state = 'PLAY'; return; }
  if (Input.hit('KeyR')) {
    FX.reducedMotion = !FX.reducedMotion;
    save('reducedMotion', FX.reducedMotion);
    Snd.select();
  }
  if (Input.hit('Backspace')) { Snd.stopMusic(); Game.state = 'TITLE'; }
}

function updateGameOver() {
  Game.endTimer++;
  if (Game.endTimer < 40) return;
  if (Input.hit('Space', 'Enter', 'NumpadEnter') || Input.downEdge) { Snd.select(); retryLevel(); }
  if (Input.hit('Backspace')) { Game.state = 'TITLE'; }
}

function updateVictory() {
  Game.endTimer++;
  if (Game.endTimer < 50) return;
  if (Input.hit('Space', 'Enter', 'NumpadEnter') || Input.downEdge) { Snd.select(); Game.state = 'TITLE'; }
}

/* -- 14. MAIN LOOP --------------------------------------------------------- */

function tick() {
  Game.frames++;
  if (Game.obamaT > 0) Game.obamaT--;
  if (Game.achievementTimer > 0) Game.achievementTimer--;
  /* The hit flash swaps in a solid-white sprite for 12 frames, and it used to
     tick down only inside updatePlay(). Anything that draws the player without
     running that -- a story beat, the upgrade screen, a floor transition,
     Bracken's rescue -- froze the flash on, so a hit taken just before one of
     those left JayC a white silhouette until play resumed. It is cosmetic, so
     it belongs here with the other frame timers, independent of game state. */
  if (Game.player && Game.player.hurtFlash > 0) Game.player.hurtFlash--;
  else Game.achievementToast = null;
  updateBarks();
  for (const t of Game.ungoonTags) t.life--;
  Game.ungoonTags = Game.ungoonTags.filter(t => t.life > 0);
  if (Input.hit('KeyM')) Snd.setMuted(!Snd.muted);

  switch (Game.state) {
    case 'TITLE':    updateTitle(); break;
    case 'QUOTES':   updateQuoteLog(); break;
    case 'ACHIEVEMENTS': updateAchievements(); break;
    case 'BOARD':    updateBoard(); break;
    case 'STORY':    updateStory(); break;
    case 'PLAY':     updatePlay(); break;
    case 'UPGRADE':  updateUpgrade(); break;
    case 'PAUSE':    updatePause(); break;
    case 'GAMEOVER': updateGameOver(); break;
    case 'VICTORY':  updateVictory(); break;
  }
  FX.update();
  Input.endFrame();
}

function render() {
  const g = ctx;
  g.imageSmoothingEnabled = false;

  switch (Game.state) {
    case 'TITLE':    renderTitle(g); break;
    case 'QUOTES':   renderQuoteLog(g); break;
    case 'ACHIEVEMENTS': renderAchievements(g); break;
    case 'BOARD':    renderBoard(g); break;
    case 'STORY':    renderStory(g); break;
    case 'UPGRADE':  renderUpgrade(g); break;
    case 'PAUSE':    renderPause(g); break;
    case 'GAMEOVER': renderGameOver(g); break;
    case 'VICTORY':  renderVictory(g); break;
    default:
      renderWorld(g);
      if (VIGNETTE) g.drawImage(VIGNETTE, 0, 0);
      renderHUD(g);
  }

  if (FX.flash > 0.02) {
    g.save();
    g.globalAlpha = clamp(FX.flash, 0, 1);
    g.fillStyle = FX.flashColor;
    g.fillRect(0, 0, VW, VH);
    g.restore();
  }

  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(stage, 0, 0, VW * View.scale, VH * View.scale);
}

const STEP = 1000 / 60;
let acc = 0, lastTime = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (!lastTime) lastTime = now;
  let dt = now - lastTime;
  lastTime = now;
  if (dt > 250) dt = 250;          // tab was backgrounded; do not spiral
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 5) { acc -= STEP; tick(); steps++; }
  if (steps >= 5) acc = 0;
  render();
}

/* -- boot ------------------------------------------------------------------ */

function boot() {
  bakeAll();
  VIGNETTE = bakeVignette();
  resize();
  Game.player = makePlayer();
  Game.state = 'TITLE';
  requestAnimationFrame(frame);
}

/* Test handle. Lets the smoke test drive the machine without pretending to
   be a person mashing keys for four minutes. */
window.__jayc = {
  Game, View, LEVELS, WEAPONS, QUOTE_BANK, STORY, SPEAKERS, FLOOR_WAVE_BARKS,
  npc: { update: updateEnemies, steering: enemySteering, clearPath: npcClearPath, route: npcRouteTo },
  rescue: { config: PUPPY_RESCUE, update: updatePuppyRescue, busy: puppyRescueBusy, camera: updateCamera },
  waves: { update: updateWaves },
  finalPets: { update: updateFinalPets, visible: finalPetsVisible, busy: finalPetsBusy },
  puppy: { config: PUPPY, update: updatePuppy, targetFor: puppyTargetFor, visible: puppyVisible, pose: puppyPose },
  SECRET_ROOMS, CAMEOS, ACHIEVEMENTS, FX, Snd, Net,
  dialogue: { queue: queueBanter, say: setBark, update: updateBarks, wrap: wrapText, secret: secretRoomStory },
  get state() { return Game.state; },
  get scale() { return View.scale; },
  get smoothing() { return sctx.imageSmoothingEnabled; },
  get jaycSprite() { return SPR.jayc.down.idle.n; },
  get gooneSprites() { return SPR.enemy; },
  cast: { layout: victoryCastLayout, get sprites() { return SPR.cast; } },
  outfits: { forEnemy: enemySpriteSet, get sprites() { return SPR.themed; }, spawn: spawnEnemy, summon: summonAdds },
  begin() { newRun(); },
  skipStory() { let guard = 0; while (Game.state === 'STORY' && guard++ < 40) finishStory(); },
  goLevel(n) {
    if (!Game.player) Game.player = makePlayer();
    startLevel(n);
    Game.state = 'PLAY';
  },
  give(id) {
    const i = WEAPON_BY_ID[id];
    Game.player.unlocked[i] = true;
    Game.player.ammo[i] = WEAPONS[i].maxAmmo;
    Game.player.weapon = i;
  },
  // deterministic target: one enemy at a known offset, clear of walls
  spawnNear(type, dx, dy) {
    const p = Game.player;
    const x = clamp(p.x + dx, 24, Game.arenaW - 24);
    const y = clamp(p.y + dy, 24, Game.arenaH - 24);
    const e = spawnEnemy(type, x, y);
    e.spawnIn = 0;
    return { x: e.x, y: e.y, hp: e.hp };
  },
  nearestTarget() {
    const p = Game.player;
    let best = null, bd = Infinity;
    for (const e of Game.enemies) {
      if (e.dead || e.spawnIn > 0) continue;
      const d = dist2(p.x, p.y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (!best) return null;
    return { sx: (best.x - Game.cam.x) * View.scale, sy: (best.y - Game.cam.y) * View.scale };
  },
  targetInfo() {
    const e = Game.enemies[0];
    if (!e) return null;
    return { hp: e.hp, sx: (e.x - Game.cam.x) * View.scale, sy: (e.y - Game.cam.y) * View.scale };
  },
  spawn(type, n) {
    for (let i = 0; i < (n || 1); i++) {
      const pt = findSpawnPoint(70);
      const e = spawnEnemy(type, pt.x, pt.y);
      e.spawnIn = 0;
    }
  },
  forceBoss() {
    Game.spawnQueue.length = 0;
    Game.enemies.length = 0;
    Game.waveIndex = LEVELS[Game.level].waves.length - 1;
    Game.waveGap = 0;
    updateWaves();
    if (Game.boss) Game.boss.spawnIn = 0;
  },
  killAll() { for (const e of Game.enemies.slice()) killEnemy(e); Game.enemies = Game.enemies.filter(e => !e.dead); },
  enterSecret(kind) { enterSecretRoom(kind); },
  completeSecret() { completeSecretRoom(); },
  unlockQuote(id) { unlockQuote(id, false); },
  sampleUngoon(type) { return nextUngoonLine(ENEMY_MEMBERS[type]); },
  bail(id) { return bailPartyMember(id); },
  retry() { retryLevel(); },
  hurt(n) { Game.player.invuln = 0; damagePlayer(n); },
  win() { Game.level = LEVELS.length - 1; levelComplete(); this.skipStory(); },
  stats() {
    return {
      state: Game.state, level: Game.level, score: Game.score, kills: Game.kills,
      enemies: Game.enemies.length, bullets: Game.bullets.length,
      particles: FX.parts.length, hp: Game.player ? Game.player.hp : -1,
      boss: Game.boss ? Game.boss.hp : null,
    };
  },
};

boot();
// Learn who the player is up front so the title can name them and a clear
// can post without a round trip first. Harmless no-op offline.
Net.refresh();
</script>
