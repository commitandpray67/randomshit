# The studio host: the app, with Caddy in front handling TLS. See DEPLOY-VPS.md.
#
#   docker compose up -d --build     start, or update after a git pull
#   docker compose logs -f           watch it
#
# Everything is read from .env beside this file (start from .env.vps.example).

name: studio

services:
  # Exactly one: drags are handed from editors to OBS in this process's memory
  # (lib/live.ts), so a second replica's viewers would miss the first's drags.
  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:?set APP_URL in .env}
    env_file: .env
    environment:
      SERVER_NAME: ${SERVER_NAME:-vps}
    restart: unless-stopped
    # Not published: only Caddy talks to it.
    expose:
      - "3000"
    healthcheck:
      # The smallest thing the app serves that touches no database, so a Neon
      # hiccup doesn't get the container restarted for nothing.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/diag/payload?kb=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      # Only there once the studio's tables have moved to this server; until
      # then there's nothing to wait for.
      db:
        condition: service_healthy
        required: false

  # The studio's own tables — scenes and their elements — once they've moved
  # off Neon (scripts/move-studio-db.sh, DEPLOY-VPS.md). Every OBS source checks
  # its scene about once a second, which kept Neon's compute running for the
  # whole of every stream; here those checks cost nothing.
  #
  # Off until the move: the script switches the "studio-db" profile on in .env.
  db:
    # The same major version as Neon runs, so its tools can copy from Neon
    # (pg_dump refuses a server newer than itself).
    image: postgres:18-alpine
    profiles: ["studio-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${STUDIO_DB_PASSWORD:-}
    # Not published: only the app, and the backups below, talk to it.
    # From 18 the image keeps its data in a per-version folder under this one
    # (/var/lib/postgresql/18/docker), so the volume goes here, not at .../data.
    volumes:
      - studio_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "studio", "-d", "studio"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A copy of the studio's tables every day, kept for two weeks, in ./backups.
  # Neon kept history for us; nothing does here unless this does. They sit on
  # the same disk, so download one now and then (DEPLOY-VPS.md says how).
  backup:
    image: postgres:18-alpine
    profiles: ["studio-db"]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${STUDIO_DB_PASSWORD:-}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        while :; do
          d=$$(date +%F)
          if pg_dump -h db -U studio -Fc -f /backups/studio-$$d.dump.part studio; then
            mv /backups/studio-$$d.dump.part /backups/studio-$$d.dump
          else
            rm -f /backups/studio-$$d.dump.part
          fi
          find /backups -name 'studio-*.dump' -mtime +14 -delete
          sleep 86400
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      MAIN_URL: ${MAIN_URL:-https://steamfriends.xyz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Keep the volume: losing it means asking Let's
      # Encrypt again, and they rate-limit repeated requests for one name.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  # Named for its major version: a later Postgres can't open this one's files,
  # so an upgrade gets a fresh volume and a copy, never this one reused.
  studio_pg18:
